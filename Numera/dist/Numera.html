  U.fix = (x, places = 4) => Math.round(x * 10 ** places) / 10 ** places;
  U.fmtDec = (x) => String(U.fix(x));
  U.dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

  MP.U = U;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Numera skill ladder, K through grade 5.
   Every skill owns a band [lo, hi] on one internal 0-100 ability scale
   (never shown to children). A generator receives d in [0,1] (position
   inside the band) and returns a problem, including "wb": the whiteboard
   steps for a worked example.

   Whiteboard markup, used in say/eq strings:
     {1:text}   colored marker (1 blue, 2 pink, 3 green, 4 yellow)
     [a/b]      stacked fraction; a and b may contain colour tokens */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = MP.U;

  // Candy palette for skill identity (glossy chips, progress path).
  const TONE = ['#FF6B6B', '#FF9F43', '#FFC53D', '#3DDC97', '#4DABF7', '#9775FA', '#F783AC', '#20C997'];

  const NAMES = ['Maya', 'Leo', 'Ava', 'Sam', 'Noor', 'Kai', 'Zoe', 'Eli', 'Rosa', 'Theo', 'Ivy', 'Omar'];
  const THINGS = ['stickers', 'shells', 'marbles', 'crayons', 'apples', 'stamps', 'rocks', 'cards'];

  const C = (i, x) => `{${i}:${x}}`;
  const say = (s) => ({ t: 'say', s });
  const eq = (s) => ({ t: 'eq', s });
  const frac = (n, d) => ({ n, d });
  const fracStr = (f) => f.n + '/' + f.d;
  const F = (n, d) => `[${n}/${d}]`;
  // Number line with unit hops (or one big hop when there are many).
  function hops(from, n, dir, c) {
    const out = [];
    if (n <= 0) return out;
    if (n > 6) return [{ from, to: from + dir * n, c, label: (dir > 0 ? '+' : '−') + n }];
    for (let i = 0; i < n; i++) out.push({ from: from + dir * i, to: from + dir * (i + 1), c, label: (dir > 0 ? '+' : '−') + '1' });
    return out;
  }
  const line = (min, max, hopsArr, marks) => ({ t: 'line', min, max, hops: hopsArr || [], marks: marks || [] });
  const placeChart = (cols) => ({ t: 'place', cols });

  const skills = [
    {
      id: 'count', name: 'Counting', grade: 'K', lo: -10, hi: 10, t: 6,
      gen(d) {
        const n = U.int(U.lerpInt(1, 9, d), U.lerpInt(3, 20, d));
        const parts = Array(Math.floor(n / 5)).fill(5);
        if (n % 5) parts.push(n % 5);
        return {
          prompt: 'How many dots?', kind: 'int', answer: n,
          visual: { type: 'dots', groups: [{ n, tone: 4 }] },
          hint: 'Touch each dot as you count. Each full row has 5.',
          explain: `There are ${n} dots.`,
          wb: [
            { t: 'dots', groups: [{ n, c: 1 }] },
            n >= 5 ? say(`Each full row has ${C(1, 5)} dots.`) : say('Touch and count each dot.'),
            eq(n >= 5 ? `${parts.join(' + ')} = ${C(3, n)}` : `${Array.from({ length: n }, (_, i) => i + 1).join(', ')} … ${C(3, n)}`),
          ],
        };
      },
    },
    {
      id: 'compare', name: 'Bigger or smaller', grade: 'K', lo: 4, hi: 16, t: 5,
      gen(d) {
        const max = d < 0.3 ? 10 : d < 0.7 ? 30 : 100;
        const a = U.int(0, max);
        const b = U.chance(0.15) ? a : U.int(0, max);
        const ans = a < b ? '<' : a > b ? '>' : '=';
        const lo = Math.floor(Math.min(a, b) / 10) * 10, hi = Math.max(lo + 10, Math.ceil((Math.max(a, b) + 1) / 10) * 10);
        return {
          prompt: 'Which sign goes in the gap?', display: `${a}  ?  ${b}`, kind: 'choice',
          choices: ['<', '=', '>'], answer: ans,
          hint: 'The open side of < or > faces the bigger number.',
          explain: a === b ? `${a} and ${b} are the same, so =.` : `${Math.max(a, b)} is bigger, so ${a} ${ans} ${b}.`,
          wb: [
            line(lo, hi, [], [{ v: a, c: 1 }, { v: b, c: 2 }]),
            say(a === b ? 'They land on the same spot. Same number!' : 'On a number line, the one further right is bigger.'),
            a === b ? eq(`${C(1, a)} = ${C(2, b)}`) : eq(`${C(1, a)} ${C(3, ans)} ${C(2, b)}`),
            a === b ? say('Same amount, so we use =.') : say(`The open mouth faces ${C(a > b ? 1 : 2, Math.max(a, b))}, the bigger number.`),
          ],
        };
      },
    },
    {
      id: 'add10', name: 'Adding within 10', grade: 'K', lo: 8, hi: 20, t: 5,
      gen(d) {
        const s = U.int(U.lerpInt(3, 6, d), U.lerpInt(5, 10, d));
        const a = U.int(0, s), b = s - a, big = Math.max(a, b), small = Math.min(a, b);
        return {
          prompt: 'Add.', display: `${a} + ${b} = ?`, kind: 'int', answer: s,
          visual: d < 0.5 ? { type: 'dots', groups: [{ n: a, tone: 4 }, { n: b, tone: 6 }] } : null,
          hint: `Start at ${big} and count on ${small} more.`,
          explain: `${a} + ${b} = ${s}.`,
          wb: [
            { t: 'dots', groups: [{ n: a, c: 1 }, { n: b, c: 2 }] },
            say(`Start at the bigger number, ${C(a >= b ? 1 : 2, big)}. Count on ${C(a >= b ? 2 : 1, small)}.`),
            line(0, 10, hops(big, small, 1, 2), [{ v: big, c: 1 }]),
            eq(`${C(1, a)} + ${C(2, b)} = ${C(3, s)}`),
          ],
        };
      },
    },
    {
      id: 'sub10', name: 'Taking away within 10', grade: 'K', lo: 12, hi: 24, t: 6,
      gen(d) {
        const a = U.int(U.lerpInt(3, 6, d), U.lerpInt(6, 10, d));
        const b = U.int(1, a);
        return {
          prompt: 'Subtract.', display: `${a} − ${b} = ?`, kind: 'int', answer: a - b,
          visual: d < 0.5 ? { type: 'dots', groups: [{ n: a - b, tone: 4 }, { n: b, tone: 4, crossed: true }] } : null,
          hint: `Start at ${a} and count back ${b}.`,
          explain: `${a} take away ${b} leaves ${a - b}.`,
          wb: [
            { t: 'dots', groups: [{ n: a - b, c: 1 }, { n: b, c: 2, crossed: true }] },
            say(`Start with ${C(1, a)}. Take away ${C(2, b)}.`),
            line(0, 10, hops(a, b, -1, 2), [{ v: a, c: 1 }]),
            eq(`${C(1, a)} − ${C(2, b)} = ${C(3, a - b)}`),
          ],
        };
      },
    },
    {
      id: 'add20', name: 'Adding within 20', grade: '1', lo: 18, hi: 30, t: 6,
      gen(d) {
        let a, b;
        if (d < 0.35) { a = U.int(8, 15); b = U.int(1, 3); }
        else { a = U.int(U.lerpInt(5, 7, d), 9); b = U.int(Math.max(11 - a, 2), 9); }
        if (U.chance(0.5)) [a, b] = [b, a];
        const s = a + b, big = Math.max(a, b), small = Math.min(a, b);
        const need = 10 - big;
        const makeTen = big < 10 && small > need;
        const story = U.chance(0.25);
        const who = U.pick(NAMES), what = U.pick(THINGS);
        const wb = makeTen ? [
          { t: 'dots', pack: true, groups: [{ n: big, c: 1 }, { n: small, c: 2 }] },
          say(`Make a ten! ${C(1, big)} needs ${C(2, need)} more to fill the frame.`),
          eq(`${C(1, big)} + ${C(2, small)} = ${C(1, big)} + ${C(2, need)} + ${C(2, small - need)}`),
          eq(`= ${C(4, 10)} + ${C(2, small - need)} = ${C(3, s)}`),
        ] : [
          say(`Start at ${C(1, big)}. Count on ${C(2, small)}.`),
          line(Math.max(0, big - 2), Math.min(20, Math.max(big + small + 2, big + 8)), hops(big, small, 1, 2), [{ v: big, c: 1 }]),
          eq(`${C(1, big)} + ${C(2, small)} = ${C(3, s)}`),
        ];
        if (story) wb.unshift(say(`${who} starts with ${C(1, a)} and gets ${C(2, b)} more. "More" means add.`));
        return {
          prompt: story ? `${who} has ${a} ${what}. ${who} gets ${b} more. How many ${what} now?` : 'Add.',
          display: story ? null : `${a} + ${b} = ?`, kind: 'int', answer: s,
          hint: makeTen ? `Make a ten: ${big} + ${need} = 10.` : `Start at ${big} and count on ${small}.`,
          explain: `${a} + ${b} = ${s}.`, wb,
        };
      },
    },
    {
      id: 'sub20', name: 'Taking away within 20', grade: '1', lo: 22, hi: 34, t: 7,
      gen(d) {
        const a = U.int(11, U.lerpInt(14, 20, d));
        const ones = a % 10;
        const b = d < 0.4 ? U.int(1, Math.max(1, ones)) : U.int(Math.min(ones + 1, 9), 9);
        const r = a - b;
        const bridge = b > ones && ones > 0;
        return {
          prompt: 'Subtract.', display: `${a} − ${b} = ?`, kind: 'int', answer: r,
          hint: `Think addition: ${b} + ? = ${a}.`,
          explain: `${a} − ${b} = ${r}.`,
          wb: bridge ? [
            say(`Take away ${C(2, b)} in two jumps. First jump to 10.`),
            line(Math.max(0, r - 1), a + 1, [{ from: a, to: 10, c: 2, label: '−' + ones }, { from: 10, to: r, c: 4, label: '−' + (b - ones) }], [{ v: a, c: 1 }]),
            eq(`${C(1, a)} − ${C(2, ones)} = 10`),
            eq(`10 − ${C(4, b - ones)} = ${C(3, r)}`),
            say(`${C(2, ones)} + ${C(4, b - ones)} is ${b}, so ${a} − ${b} = ${C(3, r)}.`),
          ] : [
            say(`Start at ${C(1, a)}. Count back ${C(2, b)}.`),
            line(Math.max(0, r - 1), a + 1, hops(a, b, -1, 2), [{ v: a, c: 1 }]),
            eq(`${C(1, a)} − ${C(2, b)} = ${C(3, r)}`),
          ],
        };
      },
    },
    {
      id: 'placeval', name: 'Tens and ones', grade: '1', lo: 26, hi: 38, t: 7,
      gen(d) {
        if (d < 0.6) {
          const tens = U.int(1, 9), ones = U.int(0, 9), n = tens * 10 + ones;
          const blocks = { t: 'base10', hundreds: 0, tens, ones };
          if (U.chance(0.5)) {
            return {
              prompt: 'What number is this?', kind: 'int', answer: n,
              visual: { type: 'base10', hundreds: 0, tens, ones },
              hint: 'Each long rod is 10. Each small cube is 1.',
              explain: `${tens} tens and ${ones} ones make ${n}.`,
              wb: [blocks, say(`${C(1, tens)} long rods: ${C(1, tens * 10)}.`), say(`${C(2, ones)} small cubes: ${C(2, ones)}.`), eq(`${C(1, tens * 10)} + ${C(2, ones)} = ${C(3, n)}`)],
            };
          }
          return {
            prompt: `How many tens are in ${n}?`, kind: 'int', answer: tens,
            visual: d < 0.3 ? { type: 'base10', hundreds: 0, tens, ones } : null,
            hint: 'The left digit of a two-digit number counts tens.',
            explain: `${n} is ${tens} tens and ${ones} ones.`,
            wb: [placeChart([['tens', tens, 3], ['ones', ones, 2]]), blocks, say(`${n} is ${C(3, tens)} tens and ${C(2, ones)} ones.`), eq(`${C(3, tens)} tens`)],
          };
        }
        const h = U.int(1, 9), t = U.int(0, 9), o = U.int(0, 9), n = h * 100 + t * 10 + o;
        const chart = (hi) => placeChart([['hundreds', h, hi === 'h' ? 3 : 1], ['tens', t, hi === 't' ? 3 : 2], ['ones', o, 4]]);
        if (U.chance(0.5)) {
          return {
            prompt: `What number is ${h} hundreds, ${t} tens and ${o} ones?`, kind: 'int', answer: n,
            hint: 'Write the hundreds digit, then tens, then ones.',
            explain: `${h * 100} + ${t * 10} + ${o} = ${n}.`,
            wb: [chart(), say('Put each digit in its place.'), eq(`${C(1, h * 100)} + ${C(2, t * 10)} + ${C(4, o)} = ${C(3, n)}`)],
          };
        }
        const which = U.pick([['hundreds', h * 100, h, 'h'], ['tens', t * 10, t, 't']]);
        const digit = which[2];
        if (digit === 0) {
          return {
            prompt: `How many hundreds are in ${n}?`, kind: 'int', answer: h,
            hint: 'In a three-digit number, the first digit counts hundreds.',
            explain: `${n} has ${h} hundreds.`,
            wb: [chart('h'), say('The first digit is the hundreds place.'), eq(`${C(3, h)} hundreds`)],
          };
        }
        return {
          prompt: `What is the ${digit} in ${n} worth?`, kind: 'int', answer: which[1],
          hint: 'Find which place the digit is in: hundreds, tens or ones.',
          explain: `The ${digit} is in the ${which[0]} place, so it is worth ${which[1]}.`,
          wb: [chart(which[3]), say(`The ${C(3, digit)} sits in the ${which[0]} place.`), eq(`${C(3, digit)} ${which[0]} = ${C(3, which[1])}`)],
        };
      },
    },
    {
      id: 'add2d', name: 'Two-digit adding', grade: '2', lo: 32, hi: 46, t: 12,
      gen(d) {
        let a, b;
        if (d < 0.4) {
          const a1 = U.int(1, 7), b1 = U.int(1, 8 - a1), a0 = U.int(0, 8), b0 = U.int(0, 9 - a0);
          a = a1 * 10 + a0; b = b1 * 10 + b0;
        } else if (d < 0.8) {
          const a0 = U.int(3, 9), b0 = U.int(10 - a0, 9);
          a = U.int(1, 6) * 10 + a0; b = U.int(1, 3) * 10 + b0;
        } else { a = U.int(120, 780); b = U.int(15, 99); }
        const regroup = (a % 10) + (b % 10) >= 10;
        return {
          prompt: 'Add.', column: { top: a, bottom: b, op: '+' }, kind: 'int', answer: a + b,
          hint: 'Add the ones first. If they make 10 or more, carry 1 ten.',
          explain: `${a} + ${b} = ${a + b}.`,
          wb: [
            say('Line up the places. Start with the ones.'),
            { t: 'column', top: a, bottom: b, op: '+' },
            regroup ? say(`${a % 10} + ${b % 10} = ${(a % 10) + (b % 10)}. Write ${C(3, ((a % 10) + (b % 10)) % 10)}, carry the ${C(4, 1)} ten.`) : say('No carrying needed this time.'),
            eq(`${a} + ${b} = ${C(3, a + b)}`),
          ],
        };
      },
    },
    {
      id: 'sub2d', name: 'Two-digit subtracting', grade: '2', lo: 36, hi: 50, t: 14,
      gen(d) {
        let a, b;
        if (d < 0.4) { const a1 = U.int(3, 9), a0 = U.int(2, 9); a = a1 * 10 + a0; b = U.int(1, a1 - 1) * 10 + U.int(0, a0); }
        else if (d < 0.8) { const a0 = U.int(0, 7); a = U.int(3, 9) * 10 + a0; b = U.int(1, Math.floor(a / 10) - 1) * 10 + U.int(a0 + 1, 9); }
        else { a = U.int(300, 900); b = U.int(25, 199); }
        const borrow = (b % 10) > (a % 10);
        return {
          prompt: 'Subtract.', column: { top: a, bottom: b, op: '−' }, kind: 'int', answer: a - b,
          hint: 'Start with the ones. If the top digit is smaller, trade 1 ten for 10 ones.',
          explain: `${a} − ${b} = ${a - b}.`,
          wb: [
            say('Line up the places. Start with the ones.'),
            { t: 'column', top: a, bottom: b, op: '−' },
            borrow ? say(`${a % 10} is smaller than ${b % 10}, so trade a ten for ${C(4, 10)} ones: ${(a % 10) + 10} − ${b % 10} = ${C(3, (a % 10) + 10 - (b % 10))}.`) : say('Every top digit is big enough. No trading needed.'),
            eq(`${a} − ${b} = ${C(3, a - b)}`),
          ],
        };
      },
    },
    {
      id: 'mul', name: 'Times tables', grade: '3', lo: 42, hi: 58, t: 6,
      gen(d) {
        let a, b;
        if (d < 0.35) { a = U.pick([2, 5, 10]); b = U.int(1, 10); }
        else if (d < 0.7) { a = U.int(3, 6); b = U.int(2, 10); }
        else { a = U.int(6, 12); b = U.int(4, 12); }
        if (U.chance(0.5)) [a, b] = [b, a];
        const story = d > 0.3 && U.chance(0.2);
        const what = U.pick(THINGS);
        const rows = Math.min(a, b), cols = Math.max(a, b), p = a * b;
        let wb;
        if (p <= 60) {
          wb = [
            { t: 'array', rows, cols },
            say(`${C(1, rows)} rows with ${C(2, cols)} in each row.`),
            say(`Skip count by ${C(2, cols)}:`),
            eq(Array.from({ length: rows }, (_, i) => i === rows - 1 ? C(3, cols * (i + 1)) : cols * (i + 1)).join(', ')),
            eq(`${C(1, rows)} × ${C(2, cols)} = ${C(3, p)}`),
          ];
        } else {
          const c1 = 5, c2 = cols - 5;
          wb = [
            say(`Big fact? Split ${C(2, cols)} into ${C(4, 5)} and ${C(2, c2)}.`),
            { t: 'area', rows: [rows], cols: [c1, c2] },
            eq(`${rows} × ${C(4, 5)} = ${rows * 5}`),
            eq(`${rows} × ${C(2, c2)} = ${rows * c2}`),
            eq(`${rows * 5} + ${rows * c2} = ${C(3, p)}`),
          ];
        }
        return {
          prompt: story ? `There are ${a} bags with ${b} ${what} in each. How many ${what}?` : 'Multiply.',
          display: story ? null : `${a} × ${b} = ?`, kind: 'int', answer: p,
          visual: d < 0.25 && p <= 40 ? { type: 'array', rows, cols } : null,
          hint: `Skip count by ${rows}: ${rows}, ${2 * rows}, ${3 * rows}...`,
          explain: `${a} groups of ${b} is ${p}.`, wb,
        };
      },
    },
    {
      id: 'div', name: 'Sharing and dividing', grade: '3', lo: 48, hi: 62, t: 7,
      gen(d) {
        let a, q;
        if (d < 0.35) { a = U.pick([2, 5, 10]); q = U.int(1, 10); }
        else if (d < 0.7) { a = U.int(3, 6); q = U.int(2, 10); }
        else { a = U.int(6, 12); q = U.int(3, 12); }
        const total = a * q;
        const wb = total <= 60 ? [
          say(`Share ${C(1, total)} into ${C(2, a)} equal rows.`),
          { t: 'array', rows: a, cols: q },
          say(`Each row gets ${C(3, q)}.`),
          eq(`${C(1, total)} ÷ ${C(2, a)} = ${C(3, q)}`),
        ] : [
          say(`Think: ${C(2, a)} times what makes ${C(1, total)}?`),
          say(`Skip count by ${C(2, a)} until you reach ${total}:`),
          eq(Array.from({ length: q }, (_, i) => (i + 1) * a).join(', ')),
          say(`That took ${C(3, q)} jumps.`),
          eq(`${C(2, a)} × ${C(3, q)} = ${C(1, total)}, so ${C(1, total)} ÷ ${C(2, a)} = ${C(3, q)}`),
        ];
        return {
          prompt: 'Divide.', display: `${total} ÷ ${a} = ?`, kind: 'int', answer: q,
          hint: `Think: ${a} × ? = ${total}.`,
          explain: `${a} × ${q} = ${total}, so ${total} ÷ ${a} = ${q}.`, wb,
        };
      },
    },
    {
      id: 'fracid', name: 'Fractions of a shape', grade: '3', lo: 50, hi: 60, t: 8,
      gen(d) {
        if (d < 0.65) {
          const den = d < 0.3 ? U.pick([2, 3, 4]) : U.pick([3, 4, 5, 6, 8]);
          const k = U.int(1, den - 1);
          const shape = U.chance(0.5) ? 'pie' : 'bar';
          return {
            prompt: 'What fraction is shaded?', kind: 'frac', answer: frac(k, den),
            visual: { type: shape, parts: den, shaded: k },
            hint: 'Bottom number: how many equal parts. Top number: how many are shaded.',
            explain: `${k} of ${den} equal parts are shaded, so ${k}/${den}.`,
            wb: [
              shape === 'pie' ? { t: 'pie', parts: den, shaded: k } : { t: 'bars', bars: [{ parts: den, fills: [{ n: k, c: 2 }] }] },
              say(`Count all the equal parts: ${C(1, den)}. That is the bottom number.`),
              say(`Count the shaded parts: ${C(2, k)}. That is the top number.`),
              eq(F(C(2, k), C(1, den))),
            ],
          };
        }
        let f1, f2;
        if (U.chance(0.5)) { const den = U.pick([4, 5, 6, 8]); f1 = frac(U.int(1, den - 1), den); f2 = frac(U.int(1, den - 1), den); }
        else { const n = U.int(1, 3); f1 = frac(n, U.int(n + 1, 8)); f2 = frac(n, U.int(n + 1, 8)); }
        const v1 = f1.n / f1.d, v2 = f2.n / f2.d;
        const ans = v1 < v2 ? '<' : v1 > v2 ? '>' : '=';
        return {
          prompt: 'Which sign goes in the gap?', display: `${fracStr(f1)}  ?  ${fracStr(f2)}`, kind: 'choice',
          choices: ['<', '=', '>'], answer: ans,
          visual: { type: 'bars2', a: f1, b: f2 },
          hint: f1.d === f2.d ? 'Same size parts: more parts is bigger.' : 'Same number of parts: bigger parts (smaller bottom number) is bigger.',
          explain: `${fracStr(f1)} ${ans} ${fracStr(f2)}.`,
          wb: [
            { t: 'bars', bars: [{ parts: f1.d, fills: [{ n: f1.n, c: 1 }] }, { parts: f2.d, fills: [{ n: f2.n, c: 2 }] }] },
            say(f1.d === f2.d ? 'Same bottom number means same size parts. Compare how many.' : 'Same top number. Fewer parts means each part is bigger.'),
            say('Compare how much of each bar is colored.'),
            eq(`${F(C(1, f1.n), C(1, f1.d))} ${C(3, ans)} ${F(C(2, f2.n), C(2, f2.d))}`),
          ],
        };
      },
    },
    {
      id: 'add3d', name: 'Big adding and subtracting', grade: '3', lo: 52, hi: 66, t: 18,
      gen(d) {
        const big = d > 0.6;
        const sub = U.chance(0.5);
        let a = big ? U.int(1200, 9800) : U.int(210, 980);
        let b = big ? U.int(300, a - 100) : U.int(105, sub ? a - 50 : 890);
        if (sub && b > a) [a, b] = [b, a];
        const op = sub ? '−' : '+', ans = sub ? a - b : a + b;
        return {
          prompt: sub ? 'Subtract.' : 'Add.', column: { top: a, bottom: b, op }, kind: 'int', answer: ans,
          hint: 'Line up the places. Work right to left: ones, tens, hundreds.',
          explain: `${a} ${op} ${b} = ${ans}.`,
          wb: [
            say('Line up the places. Work right to left, one column at a time.'),
            { t: 'column', top: a, bottom: b, op },
            say(sub ? `When a top digit is too small, trade from the next place (${C(4, 'yellow')} marks).` : `When a column makes 10 or more, carry to the next place (${C(4, 'yellow')} marks).`),
            eq(`${a} ${op} ${b} = ${C(3, ans)}`),
          ],
        };
      },
    },
    {
      id: 'mulmd', name: 'Multi-digit multiplying', grade: '4', lo: 60, hi: 74, t: 25,
      gen(d) {
        let a, b;
        if (d < 0.4) { a = U.int(12, 49); b = U.int(2, 6); }
        else if (d < 0.75) { a = U.int(102, 489); b = U.int(3, 9); }
        else { a = U.int(12, 39); b = U.int(11, 29); }
        const split = (n) => String(n).split('').map((ch, i, arr) => Number(ch) * 10 ** (arr.length - 1 - i)).filter((x) => x > 0);
        const cols = split(a), rows = split(b);
        const parts = [];
        rows.forEach((r) => cols.forEach((c) => parts.push(r * c)));
        return {
          prompt: 'Multiply.', column: { top: a, bottom: b, op: '×' }, kind: 'int', answer: a * b,
          hint: `Break it apart by place value: ${rows.flatMap((r) => cols.map((c) => `${c} × ${r}`)).join(' + ')} = ?`,
          explain: `${a} × ${b} = ${a * b}.`,
          wb: [
            say(`Break ${C(1, a)}${rows.length > 1 ? ` and ${C(2, b)}` : ''} into place-value parts.`),
            { t: 'area', rows, cols },
            say('Multiply each box, then add the boxes.'),
            eq(`${parts.join(' + ')} = ${C(3, a * b)}`),
          ],
        };
      },
    },
    {
      id: 'fraceq', name: 'Equivalent fractions', grade: '4', lo: 62, hi: 74, t: 12,
      gen(d) {
        const den = U.pick([2, 3, 4, 5, 6]);
        const n = U.int(1, den - 1);
        const g = U.gcd(n, den);
        const base = frac(n / g, den / g);
        const k = U.int(2, d < 0.5 ? 4 : 6);
        const bars = { t: 'bars', bars: [{ parts: base.d, fills: [{ n: base.n, c: 1 }] }, { parts: base.d * k, fills: [{ n: base.n * k, c: 2 }] }] };
        if (d < 0.7) {
          const askTop = U.chance(0.6);
          return {
            prompt: askTop ? `Fill in the top number: ${fracStr(base)} = ?/${base.d * k}` : `Fill in the bottom number: ${fracStr(base)} = ${base.n * k}/?`,
            display: askTop ? `${fracStr(base)} = ?/${base.d * k}` : `${fracStr(base)} = ${base.n * k}/?`,
            kind: 'int', answer: askTop ? base.n * k : base.d * k,
            hint: `Top and bottom get multiplied by the same number (${k}).`,
            explain: `${base.n} × ${k} = ${base.n * k} and ${base.d} × ${k} = ${base.d * k}.`,
            wb: [
              bars,
              say(`Cut every part into ${C(4, k)} smaller parts. Same amount colored!`),
              eq(`${F(`${base.n} × ${C(4, k)}`, `${base.d} × ${C(4, k)}`)} = ${F(C(askTop ? 3 : 2, base.n * k), C(askTop ? 2 : 3, base.d * k))}`),
              say('Whatever you do to the bottom, do to the top.'),
            ],
          };
        }
        return {
          prompt: 'Write this fraction in simplest form.', display: `${base.n * k}/${base.d * k}`,
          kind: 'frac', answer: base, requireSimplest: true,
          hint: 'Find a number that divides both top and bottom. Keep going until you cannot.',
          explain: `Divide top and bottom by ${k}: ${fracStr(base)}.`,
          wb: [
            say(`Both ${C(2, base.n * k)} and ${C(2, base.d * k)} can be divided by ${C(4, k)}.`),
            eq(`${F(`${base.n * k} ÷ ${C(4, k)}`, `${base.d * k} ÷ ${C(4, k)}`)} = ${F(C(3, base.n), C(3, base.d))}`),
            { t: 'bars', bars: [{ parts: base.d * k, fills: [{ n: base.n * k, c: 2 }] }, { parts: base.d, fills: [{ n: base.n, c: 3 }] }] },
            say('Same amount, fewer and bigger parts.'),
          ],
        };
      },
    },
    {
      id: 'longdiv', name: 'Long division', grade: '4', lo: 66, hi: 80, t: 30,
      gen(d) {
        let a, q;
        if (d < 0.4) { a = U.int(2, 6); q = U.int(11, 29); }
        else if (d < 0.75) { a = U.int(3, 9); q = U.int(21, 140); }
        else { a = U.int(11, 25); q = U.int(12, 45); }
        const total = a * q;
        const chunks = String(q).split('').map((ch, i, arr) => Number(ch) * 10 ** (arr.length - 1 - i)).filter((x) => x > 0);
        let left = total;
        const steps = chunks.map((c) => { const before = left; left -= a * c; return eq(`${C(2, a)} × ${C(4, c)} = ${a * c}   →   ${before} − ${a * c} = ${left}`); });
        return {
          prompt: 'Divide.', display: `${total} ÷ ${a} = ?`, kind: 'int', answer: q,
          hint: `Take away big groups of ${a}: try ${a} × 10 first.`,
          explain: `${a} × ${q} = ${total}, so the answer is ${q}.`,
          wb: [
            say(`Take away groups of ${C(2, a)} from ${C(1, total)}, in big friendly chunks.`),
            ...steps,
            say('Nothing left! Add up the chunks.'),
            eq(`${chunks.map((c) => C(4, c)).join(' + ')} = ${C(3, q)}`),
          ],
        };
      },
    },
    {
      id: 'fracadd', name: 'Adding fractions', grade: '5', lo: 68, hi: 84, t: 22,
      gen(d) {
        let f1, f2;
        if (d < 0.45) {
          const den = U.pick([4, 5, 6, 8, 10]);
          f1 = frac(U.int(1, den - 2), den); f2 = frac(U.int(1, den - f1.n - 1), den);
        } else if (d < 0.75) {
          const den = U.pick([2, 3, 4, 5]); const k = U.pick([2, 3]);
          f1 = frac(U.int(1, den - 1), den); f2 = frac(U.int(1, den * k - 1), den * k);
        } else {
          const pair = U.pick([[2, 3], [3, 4], [2, 5], [4, 6], [3, 5]]);
          f1 = frac(U.int(1, pair[0] - 1), pair[0]); f2 = frac(U.int(1, pair[1] - 1), pair[1]);
        }
        const n = f1.n * f2.d + f2.n * f1.d, dd = f1.d * f2.d, g = U.gcd(n, dd);
        const lcd = f1.d * f2.d / U.gcd(f1.d, f2.d);
        const n1 = f1.n * lcd / f1.d, n2 = f2.n * lcd / f2.d;
        const bar = n1 + n2 <= lcd ? { t: 'bars', bars: [{ parts: lcd, fills: [{ n: n1, c: 1 }, { n: n2, c: 2 }] }] } : null;
        const wb = f1.d === f2.d ? [
          bar,
          say('Same bottom number, so the parts are the same size. Add the tops.'),
          eq(`${F(C(1, f1.n), f1.d)} + ${F(C(2, f2.n), f2.d)} = ${F(C(3, f1.n + f2.n), f1.d)}`),
        ] : [
          say(`Different bottoms. Make them match: use ${C(4, lcd)}.`),
          f1.d !== lcd ? eq(`${F(f1.n, f1.d)} = ${F(C(1, n1), C(4, lcd))}`) : null,
          f2.d !== lcd ? eq(`${F(f2.n, f2.d)} = ${F(C(2, n2), C(4, lcd))}`) : null,
          bar,
          eq(`${F(C(1, n1), lcd)} + ${F(C(2, n2), lcd)} = ${F(C(3, n1 + n2), lcd)}`),
        ];
        return {
          prompt: 'Add. Any equal fraction is OK.', display: `${fracStr(f1)} + ${fracStr(f2)} = ?`,
          kind: 'frac', answer: frac(n / g, dd / g),
          hint: f1.d === f2.d ? 'Same bottom number: add the tops, keep the bottom.' : `Make the bottoms match. Try ${lcd}ths.`,
          explain: `The answer is ${n / g}/${dd / g}.`, wb: wb.filter(Boolean),
        };
      },
    },
    {
      id: 'dec', name: 'Decimals', grade: '4', lo: 72, hi: 86, t: 15,
      gen(d) {
        if (d < 0.35) {
          const a = U.int(1, 9) / 10, b = U.fix(U.int(10, 99) / 100);
          const [x, y] = U.chance(0.5) ? [a, b] : [b, a];
          const ans = x < y ? '<' : x > y ? '>' : '=';
          return {
            prompt: 'Which sign goes in the gap?', display: `${U.fmtDec(x)}  ?  ${U.fmtDec(y)}`, kind: 'choice',
            choices: ['<', '=', '>'], answer: ans,
            hint: 'Write both with two decimal places, like 0.50 and 0.45, then compare.',
            explain: `${x.toFixed(2)} ${ans} ${y.toFixed(2)}.`,
            wb: [
              say('Give both numbers the same number of decimal places.'),
              eq(`${U.fmtDec(x)} → ${C(1, x.toFixed(2))}`),
              eq(`${U.fmtDec(y)} → ${C(2, y.toFixed(2))}`),
              say(`Now compare like whole numbers: ${Math.round(x * 100)} hundredths and ${Math.round(y * 100)} hundredths.`),
              eq(`${C(1, x.toFixed(2))} ${C(3, ans)} ${C(2, y.toFixed(2))}`),
            ],
          };
        }
        const hundredths = d > 0.7;
        const a = hundredths ? U.int(120, 950) / 100 : U.int(11, 89) / 10;
        const b = hundredths ? U.int(5, Math.floor(a * 10)) / 10 : U.int(11, 69) / 10;
        const sub = hundredths && U.chance(0.5) && a > b;
        const ans = U.fix(sub ? a - b : a + b);
        const places = hundredths ? 2 : 1;
        return {
          prompt: sub ? 'Subtract.' : 'Add.', display: `${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ?`,
          kind: 'dec', answer: ans,
          hint: 'Line up the decimal points, then add or subtract like whole numbers.',
          explain: `${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ${U.fmtDec(ans)}.`,
          wb: [
            say(`Line up the ${C(4, 'decimal points')}. Fill gaps with 0.`),
            { t: 'column', top: a, bottom: b, op: sub ? '−' : '+', places },
            say('The point in the answer drops straight down.'),
            eq(`${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ${C(3, U.fmtDec(ans))}`),
          ],
        };
      },
    },
    {
      id: 'fracmul', name: 'Fractions of a number', grade: '5', lo: 78, hi: 90, t: 18,
      gen(d) {
        if (d < 0.7) {
          const den = U.pick([2, 3, 4, 5, 6, 8]);
          const num = d < 0.35 ? 1 : U.int(2, den - 1);
          const whole = den * U.int(2, 9);
          const each = whole / den;
          return {
            prompt: `What is ${num}/${den} of ${whole}?`, kind: 'int', answer: each * num,
            hint: `First find 1/${den} of ${whole} by dividing by ${den}.`,
            explain: `${whole} ÷ ${den} = ${each}${num > 1 ? `, then × ${num} = ${each * num}` : ''}.`,
            wb: [
              say(`Split ${C(1, whole)} into ${C(2, den)} equal groups.`),
              { t: 'bars', bars: [{ parts: den, fills: [{ n: num, c: 3 }], labels: each }] },
              eq(`${C(1, whole)} ÷ ${C(2, den)} = ${C(4, each)} in each group`),
              num > 1 ? say(`Take ${C(3, num)} of the groups.`) : say('Take one group.'),
              eq(num > 1 ? `${C(3, num)} × ${C(4, each)} = ${C(3, each * num)}` : `${F(1, den)} of ${whole} = ${C(3, each)}`),
            ],
          };
        }
        const den = U.pick([3, 4, 5, 6, 8]), num = U.int(1, den - 1), w = U.int(2, 7);
        const g = U.gcd(num * w, den);
        return {
          prompt: 'Multiply. Any equal fraction is OK.', display: `${w} × ${num}/${den} = ?`, kind: 'frac',
          answer: frac(num * w / g, den / g),
          hint: 'Multiply the top number by the whole number. The bottom stays.',
          explain: `${w} × ${num} = ${w * num}, so ${w * num}/${den}.`,
          wb: [
            say(`${C(1, w)} × ${F(num, den)} means ${C(1, w)} groups of ${F(num, den)}.`),
            w <= 4 ? { t: 'bars', bars: Array.from({ length: w }, () => ({ parts: den, fills: [{ n: num, c: 2 }] })) } : null,
            eq(w <= 4 ? `${Array(w).fill(F(C(2, num), den)).join(' + ')} = ${F(C(3, num * w), den)}` : `${C(1, w)} × ${C(2, num)} = ${C(3, num * w)}`),
            say('The size of the parts (the bottom) stays the same.'),
            eq(`${C(1, w)} × ${F(C(2, num), den)} = ${F(C(3, num * w), den)}`),
          ].filter(Boolean),
        };
      },
    },
    {
      id: 'decmul', name: 'Multiplying decimals', grade: '5', lo: 84, hi: 96, t: 18,
      gen(d) {
        if (d < 0.35) {
          const a = U.fix(U.int(11, 999) / 100), p = U.pick([10, 100, 1000]);
          const k = String(p).length - 1;
          return {
            prompt: 'Multiply.', display: `${U.fmtDec(a)} × ${p} = ?`, kind: 'dec', answer: U.fix(a * p),
            hint: `× ${p} moves every digit ${k} place${k > 1 ? 's' : ''} to the left.`,
            explain: `${U.fmtDec(a)} × ${p} = ${U.fmtDec(a * p)}.`,
            wb: [
              say(`Times ${C(2, p)}: every digit gets ${C(2, p)} times bigger.`),
              say(`Same as hopping the decimal point ${C(2, k)} place${k > 1 ? 's' : ''} to the right.`),
              { t: 'shift', num: U.fmtDec(a), places: k },
              k > 1 && String(U.fix(a * p)).length > String(a).replace('.', '').replace(/^0+/, '').length ? say(`Run out of digits? Fill the empty places with ${C(4, 0)}.`) : null,
              eq(`${C(1, U.fmtDec(a))} × ${C(2, p)} = ${C(3, U.fmtDec(U.fix(a * p)))}`),
            ].filter(Boolean),
          };
        }
        const aT = U.int(2, 9), a = aT / 10;
        const whole = d < 0.7;
        const bRaw = U.int(2, 9), b = whole ? bRaw : bRaw / 10;
        const ans = U.fix(a * b);
        return {
          prompt: 'Multiply.', display: `${U.fmtDec(a)} × ${U.fmtDec(b)} = ?`, kind: 'dec', answer: ans,
          hint: 'Multiply as whole numbers, then count the decimal places in both numbers.',
          explain: `${U.fmtDec(a)} × ${U.fmtDec(b)} = ${U.fmtDec(ans)}.`,
          wb: whole ? [
            say(`${C(1, U.fmtDec(a))} is ${C(1, aT)} tenths.`),
            eq(`${C(1, aT)} tenths × ${C(2, b)} = ${C(4, aT * b)} tenths`),
            eq(`${C(4, aT * b)} tenths = ${C(3, U.fmtDec(ans))}`),
          ] : [
            say('Ignore the points and multiply.'),
            eq(`${C(1, aT)} × ${C(2, bRaw)} = ${C(4, aT * bRaw)}`),
            say(`Count decimal places: ${C(1, 1)} + ${C(2, 1)} = 2. The answer needs 2 places.`),
            eq(`${U.fmtDec(a)} × ${U.fmtDec(b)} = ${C(3, ans.toFixed(2))}`),
          ],
        };
      },
    },
    {
      id: 'ooo', name: 'Order of operations', grade: '5', lo: 86, hi: 100, t: 20,
      gen(d) {
        const a = U.int(2, 9), b = U.int(2, 9), c = U.int(2, 9);
        if (d < 0.4) {
          return {
            prompt: 'Solve. Multiply before you add.', display: `${a} + ${b} × ${c} = ?`, kind: 'int', answer: a + b * c,
            hint: 'Do × and ÷ first, then + and −.', explain: `${b} × ${c} = ${b * c}, then ${a} + ${b * c} = ${a + b * c}.`,
            wb: [say('Multiply first. Circle the ×.'), eq(`${a} + ${C(4, `${b} × ${c}`)}`), eq(`= ${a} + ${C(4, b * c)}`), eq(`= ${C(3, a + b * c)}`)],
          };
        }
        if (d < 0.75) {
          return {
            prompt: 'Solve. Brackets first.', display: `(${a} + ${b}) × ${c} = ?`, kind: 'int', answer: (a + b) * c,
            hint: 'Work inside the brackets first.', explain: `${a} + ${b} = ${a + b}, then × ${c} = ${(a + b) * c}.`,
            wb: [say('Brackets go first.'), eq(`${C(4, `(${a} + ${b})`)} × ${c}`), eq(`= ${C(4, a + b)} × ${c}`), eq(`= ${C(3, (a + b) * c)}`)],
          };
        }
        const e = U.int(2, 5), f = e * U.int(2, 6);
        const big = Math.max(a, b) + 1, small = Math.min(a, b);
        const p1 = (big - small) * c, p2 = f / e;
        return {
          prompt: 'Solve.', display: `(${big} − ${small}) × ${c} + ${f} ÷ ${e} = ?`, kind: 'int', answer: p1 + p2,
          hint: 'Brackets, then × and ÷ left to right, then + and −.',
          explain: `(${big} − ${small}) × ${c} + ${f} ÷ ${e} = ${p1 + p2}.`,
          wb: [
            say(`Order: ${C(4, 'brackets')}, then × and ÷, then + and −.`),
            eq(`${C(4, `(${big} − ${small})`)} × ${c} + ${f} ÷ ${e}`),
            eq(`= ${C(1, `${big - small} × ${c}`)} + ${C(2, `${f} ÷ ${e}`)}`),
            eq(`= ${C(1, p1)} + ${C(2, p2)}`),
            eq(`= ${C(3, p1 + p2)}`),
          ],
        };
      },
    },
  ];

  const byId = {};
  skills.forEach((s, i) => { s.index = i; s.color = TONE[i % TONE.length]; byId[s.id] = s; });

  // Grade bands on the internal ability scale (grown-up labels and starting points).
  const GRADES = [
    { g: 'K', start: 8, upTo: 17 },
    { g: '1', start: 22, upTo: 32 },
    { g: '2', start: 37, upTo: 48 },
    { g: '3', start: 51, upTo: 63 },
    { g: '4', start: 65, upTo: 79 },
    { g: '5', start: 80, upTo: 101 },
  ];
  function gradeFor(theta) {
    for (const b of GRADES) if (theta < b.upTo) return b.g;
    return '5';
  }
  function gradeLabel(g) { return g === 'K' ? 'Kindergarten' : 'Grade ' + g; }
  function startTheta(g) { return (GRADES.find((b) => b.g === g) || GRADES[2]).start; }
  // "early / mid / late Grade 3" for grown-ups, instead of a raw number.
  function gradeDetail(theta) {
    const i = GRADES.findIndex((b) => theta < b.upTo);
    const b = GRADES[i < 0 ? GRADES.length - 1 : i];
    const lo = i <= 0 ? 0 : GRADES[i - 1].upTo, hi = Math.min(100, b.upTo);
    const f = (theta - lo) / (hi - lo);
    return (f < 0.34 ? 'early ' : f < 0.67 ? 'mid ' : 'late ') + (b.g === 'K' ? 'kindergarten' : 'grade ' + b.g);
  }

  function makeItem(skill, b) {
    const d = U.clamp((b - skill.lo) / (skill.hi - skill.lo), 0, 1);
    const base = skill.gen(d);
    return Object.assign({
      id: U.uid(), skillId: skill.id, d, b: U.lerp(skill.lo, skill.hi, d),
      expected: skill.t * (1 + 0.6 * d),
    }, base);
  }

  function skillsAt(b) {
    const bb = U.clamp(b, skills[0].lo, 100);
    let c = skills.filter((s) => bb >= s.lo - 1 && bb <= s.hi + 1);
    if (!c.length) c = [skills.reduce((best, s) => (Math.abs((s.lo + s.hi) / 2 - bb) < Math.abs((best.lo + best.hi) / 2 - bb) ? s : best))];
    return c;
  }

  function checkAnswer(item, input) {
    if (input == null) return false;
    switch (item.kind) {
      case 'int': return String(input).trim() !== '' && Number(input) === item.answer;
      case 'dec': {
        const x = parseFloat(input);
        return !isNaN(x) && Math.abs(U.fix(x) - item.answer) < 1e-9;
      }
      case 'choice': return input === item.answer;
      case 'frac': {
        const n = parseInt(input.n, 10);
        const dRaw = String(input.d || '').trim();
        const dd = dRaw === '' ? 1 : parseInt(dRaw, 10);
        if (isNaN(n) || isNaN(dd) || dd === 0) return false;
        if (n * item.answer.d !== item.answer.n * dd) return false;
        if (item.requireSimplest) return U.gcd(n, dd) === 1;
        return true;
      }
    }
    return false;
  }

  function answerText(item) {
    if (item.kind === 'frac') return item.answer.d === 1 ? String(item.answer.n) : fracStr(item.answer);
    if (item.kind === 'dec') return U.fmtDec(item.answer);
    return String(item.answer);
  }

  MP.Skills = { list: skills, byId, TONE, GRADES, gradeFor, gradeLabel, gradeDetail, startTheta, makeItem, skillsAt, checkAnswer, answerText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Numera adaptive engine.

   Ability model: one number (theta, 0-100) per learner, updated Elo/Rasch
   style after every answer. P(correct) = logistic((theta - b) / S).

   Placement: a computer-adaptive test. Each item is aimed at P = 0.5 (the
   most informative point); the step size shrinks as evidence builds.

   Sessions: short sets that mix item "roles" aimed at different success
   probabilities (warm-up 90%, core ~75%, stretch 55%, challenge 42%).

   Engagement controller: two running signals, frustration (F) and boredom
   (B), built from accuracy, streaks, response time relative to the learner's
   own pace, hints, skips and rapid guessing. High F eases off; high B lifts.

   Across sessions: a per-learner "challenge dial" (offset) and session length
   adapt to quits, self-reports and boredom, so the next session starts in a
   better place instead of repeating a static level. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = MP.U, SK = MP.Skills;

  const S = 6; // ability points per logit
    const ROLE_SHORT = { warmup: 'Warm', review: 'Rev', ease: 'Easy', finisher: 'Fin', retry: 'Retry', core: 'Core', stretch: 'Str', challenge: 'Chal', placement: 'Place' };
  const ROLE_LABEL = { warmup: 'Warm-up', review: 'Review', ease: 'Confidence', finisher: 'Finisher', retry: 'Second try', core: 'Core', stretch: 'Stretch', challenge: 'Challenge', placement: 'Placement' };

  const P = (theta, b) => U.logistic((theta - b) / S);
  const bFor = (theta, p) => theta - S * U.logit(p);

  function newProfile(name, grade, color) {
    const theta = SK.startTheta(grade);
    return {
      id: U.uid(), name, grade, color: color || 9, created: Date.now(),
      theta, placed: false, offset: 0, speed: 1, mode: 'balanced', qCount: 10, nudge: 0, harderTrust: 1,
      skills: {}, sessions: [], history: [{ t: Date.now(), theta, kind: 'start' }], demo: false, xp: 0,
    };
  }

  /* ---------------- Level + XP (what the child sees) ----------------
     Everyone starts at Level 1. XP comes from effort as well as correct
     answers, and never goes down, so the level only ever celebrates. */
  const XP = { correct: 10, hinted: 8, retry: 12, stretch: 15, challenge: 20, effort: 3, session: 25, placement: 20 };
  const levelNeed = (L) => 80 + 20 * L; // XP to go from level L to L+1
  function levelInfo(xp) {
    let level = 1, rem = Math.max(0, xp || 0), need = levelNeed(1);
    while (rem >= need) { rem -= need; level++; need = levelNeed(level); }
    return { level, into: rem, need, pct: rem / need };
  }
  function awardXP(profile, amt) {
    const before = levelInfo(profile.xp).level;
    profile.xp = (profile.xp || 0) + amt;
    const after = levelInfo(profile.xp).level;
    return { xp: amt, levelUp: after > before ? after : 0 };
  }
  function xpFor(item, r) {
    if (r.skipped || !r.correct) return XP.effort;
    if (r.hinted) return XP.hinted;
    return XP[item.role] || XP.correct;
  }

  function skillStat(profile, id) {
    return (profile.skills[id] = profile.skills[id] || { n: 0, correct: 0, acc: 0.5, last: 0, assumed: false });
  }

  function expectedTime(item, profile) { return item.expected * U.clamp(profile.speed || 1, 0.5, 3); }

  // Score for the ability update: correctness, shaded by speed and help.
  function scoreOf(r, item, profile) {
    if (r.skipped || !r.correct) return 0;
    let s = 1;
    if (r.hinted) s = 0.6;
    else if (r.time > 2.5 * expectedTime(item, profile)) s = 0.85;
    return s;
  }

  // Choose a skill for difficulty b, preferring variety.
  function chooseSkill(b, recent, profile, exclude) {
    let cands = SK.skillsAt(b).filter((s) => !(exclude || []).includes(s.id));
    if (!cands.length) cands = SK.skillsAt(b);
    const weights = cands.map((s) => {
      let w = 1;
      const i = recent.lastIndexOf(s.id);
      if (i >= 0) w *= recent.length - i <= 1 ? 0.15 : recent.length - i <= 3 ? 0.5 : 1;
      const st = profile.skills[s.id];
      if (!st || st.n < 3) w *= 1.3; // gently favour less-practised skills
      return w;
    });
    const tot = weights.reduce((a, x) => a + x, 0);
    let r = U.rand() * tot;
    for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r <= 0) return cands[i]; }
    return cands[cands.length - 1];
  }

  /* ---------------- Placement ---------------- */

  function startPlacement(profile) {
    return { kind: 'placement', theta: profile.theta, n: 0, max: 12, info: 0, answers: [], recent: [], start: Date.now(), consecWrong: 0 };
  }

  function nextPlacementItem(st, profile) {
    // Aim at P=0.5 with a little jitter so we don't repeat the same exact band.
    let b = st.theta + (U.rand() - 0.5) * 3;
    // After two misses in a row, give an easier one so the check-in stays kind.
    if (st.consecWrong >= 2) b = st.theta - 8;
    const skill = chooseSkill(b, st.recent, profile);
    const item = SK.makeItem(skill, b);
    item.role = 'placement';
    return item;
  }

  function recordPlacement(st, profile, item, r) {
    const p = P(st.theta, item.b);
    const score = r.skipped ? 0 : r.correct ? (r.hinted ? 0.7 : 1) : 0;
    const K = Math.max(3, 15 * Math.pow(0.8, st.n));
    st.theta = U.clamp(st.theta + K * 2 * (score - p), 0, 100);
    st.info += p * (1 - p);
    st.n++;
    st.recent.push(item.skillId);
    st.consecWrong = score > 0 ? 0 : st.consecWrong + 1;
    st.answers.push({ skill: item.skillId, b: U.fix(item.b, 1), correct: !!r.correct, skipped: !!r.skipped, time: U.fix(r.time, 1), theta: U.fix(st.theta, 1) });
    return awardXP(profile, xpFor(item, r));
  }

  function placementSE(st) { return st.info > 0 ? S / Math.sqrt(st.info) : 99; }
  function placementDone(st) { return st.n >= st.max || (st.n >= 8 && placementSE(st) < 6 && Math.abs(st.answers[st.n - 1].theta - st.answers[st.n - 3].theta) < 3); }

  function finishPlacement(st, profile) {
    profile.theta = U.fix(st.theta, 2);
    profile.placed = true;
    profile.placedAt = Date.now();
    profile.placement = { answers: st.answers, theta: profile.theta, se: U.fix(placementSE(st), 1) };
    // Skills well below the placement are assumed known (used for review).
    SK.list.forEach((s) => { if (s.hi < profile.theta - 4) { const k = skillStat(profile, s.id); k.assumed = true; } });
    st.answers.forEach((a) => { const k = skillStat(profile, a.skill); k.n++; if (a.correct) k.correct++; k.acc = k.correct / k.n; k.last = Date.now(); });
    profile.history.push({ t: Date.now(), theta: profile.theta, kind: 'placement' });
    const aw = awardXP(profile, XP.placement);
    return { theta: profile.theta, grade: SK.gradeFor(profile.theta), levelUp: aw.levelUp };
  }

  /* ---------------- Sessions ----------------
     Three modes the learner (or a grown-up) picks. Each sets a target
     success rate and a rhythm of question roles. After EVERY answer a
     staircase nudges difficulty toward the target: a right answer makes
     the next one harder, a miss makes it easier. Streaks can't coast. */

  const MODES = {
    easy: {
      label: 'Take it easy', blurb: 'Lots of wins. Warm-up reps.', target: 0.9, warmups: 2,
      p: { warmup: 0.97, core: 0.95, review: 0.96, stretch: 0.87, retry: 0.94, ease: 0.97, challenge: 0.75, finisher: 0.97 },
      plan: ['core', 'core', 'review', 'core', 'stretch', 'core', 'core', 'review'],
    },
    balanced: {
      label: 'Give me some hard ones', blurb: 'A mix of easy and tricky.', target: 0.7, warmups: 1,
      p: { warmup: 0.9, core: 0.74, review: 0.9, stretch: 0.5, retry: 0.8, ease: 0.93, challenge: 0.42, finisher: 0.86 },
      plan: ['core', 'stretch', 'core', 'review', 'stretch', 'core', 'stretch', 'core'],
    },
    stretch: {
      label: "Let's do this!", blurb: 'Big challenges. Tough on purpose.', target: 0.5, warmups: 1,
      p: { warmup: 0.85, core: 0.55, review: 0.85, stretch: 0.42, retry: 0.7, ease: 0.88, challenge: 0.35, finisher: 0.7 },
      plan: ['stretch', 'core', 'stretch', 'stretch', 'core', 'stretch', 'review', 'stretch'],
    },
  };
  const STEP = 4; // staircase step (ability points) per answer

  /* Success targets by enrolled grade (how much struggle a child can
     take depends on age, not skill level). Columns: easy, balanced, stretch. */
  const GRADE_ORDER = ['K', '1', '2', '3', '4', '5'];
  const GRADE_TARGETS = {
    K: [0.95, 0.85, 0.75], 1: [0.93, 0.82, 0.70], 2: [0.92, 0.80, 0.65],
    3: [0.90, 0.75, 0.60], 4: [0.90, 0.72, 0.55], 5: [0.90, 0.70, 0.50],
  };
  const MODE_COL = { easy: 0, balanced: 1, stretch: 2 };
  // Each child can drift up to one grade row either way from their own
  // signals (profile.nudge in [-1, 1]; positive = harder row).
  function targetsFor(profile) {
    const gi = Math.max(0, GRADE_ORDER.indexOf(String(profile.grade)));
    const x = U.clamp(gi + (profile.nudge || 0), 0, GRADE_ORDER.length - 1);
    const lo = Math.floor(x), hi = Math.ceil(x), f = x - lo;
    const rl = GRADE_TARGETS[GRADE_ORDER[lo]], rh = GRADE_TARGETS[GRADE_ORDER[hi]];
    const out = {};
    Object.keys(MODE_COL).forEach((m) => { out[m] = U.fix(U.lerp(rl[MODE_COL[m]], rh[MODE_COL[m]], f), 3); });
    return out;
  }
  // Shift a mode's whole rhythm (every role's success rate) to the target.
  function modeSpec(profile, mode) {
    const M = MODES[mode];
    const target = targetsFor(profile)[mode];
    const shift = U.logit(target) - U.logit(M.target);
    const p = {};
    Object.keys(M.p).forEach((k) => { p[k] = U.clamp(U.logistic(U.logit(M.p[k]) + shift), 0.3, 0.985); });
    return { target, p };
  }
  function nudgeLabel(profile) {
    const n = profile.nudge || 0;
    if (Math.abs(n) < 0.17) return 'no nudge';
    const steps = Math.round(Math.abs(n) * 3) / 3;
    return `nudged ${steps >= 0.99 ? 'a full grade' : steps >= 0.66 ? 'two steps' : 'one step'} ${n > 0 ? 'harder' : 'gentler'}`;
  }

  function daysSinceLast(profile, now) {
    const last = profile.sessions[profile.sessions.length - 1];
    return last ? (now - last.end) / 864e5 : 0;
  }

  function startSession(profile, now, opts) {
    now = now || Date.now();
    opts = opts || {};
    const mode = MODES[opts.mode || profile.mode] ? (opts.mode || profile.mode) : 'balanced';
    const len = U.clamp(Number(opts.len || profile.qCount || 10), 3, 30);
    const gap = daysSinceLast(profile, now);
    const spec = modeSpec(profile, mode);
    const st = {
      kind: 'session', id: U.uid(), start: now, len, idx: 0, mode, target: spec.target, p: spec.p, harderChecks: [], forceChallenge: false,
      F: 0, B: 0, peakF: 0, peakB: 0, stair: 0, consecWrong: 0, consecRight: 0,
      answers: [], log: [], recent: [], retryQueue: [], welcomeBack: gap >= 4, xp: 0, lastB: null,
    };
    if (st.welcomeBack) st.log.push({ i: 0, type: 'ease', text: `Back after ${Math.round(gap)} days, so the session opens with an extra warm-up.` });
    const recentQuits = profile.sessions.slice(-3).filter((s) => !s.completed).length;
    if (recentQuits >= 2) st.log.push({ i: 0, type: 'info', text: `${recentQuits} of the last 3 sessions ended early. Consider fewer questions or "Take it easy".` });
    return st;
  }

  function masteredSkills(profile) {
    return SK.list.filter((s) => {
      const k = profile.skills[s.id];
      return s.hi < profile.theta - 2 && (!k || k.assumed || k.acc >= 0.7);
    });
  }

  function pickRole(st, profile) {
    const M = MODES[st.mode], i = st.idx;
    const warmups = Math.min(M.warmups + (st.welcomeBack ? 1 : 0), Math.max(0, st.len - 2));
    if (i < warmups) return 'warmup';
    if (i === st.len - 1 && st.len >= 4) return 'finisher'; // end on a likely win
    if (st.F >= 0.55) return 'ease';
    if (st.forceChallenge) { st.forceChallenge = false; st.lastForced = true; return 'challenge'; }
    if (st.retryQueue.find((r) => r.at <= i)) return 'retry';
    if (st.B >= 0.55) return 'challenge';
    const role = M.plan[(i - warmups) % M.plan.length];
    if (role === 'review' && !masteredSkills(profile).length) return 'core';
    return role;
  }

  // Difficulty for a role right now: ability estimate, the learned
  // challenge dial, and the per-answer staircase.
  function targetB(st, profile, role) {
    const table = st.p || MODES[st.mode].p;
    const pTarget = table[role] || table.core;
    const steady = ['ease', 'warmup', 'finisher'].includes(role);
    const shift = profile.offset + st.stair;
    return bFor(profile.theta, pTarget) + (steady ? Math.min(shift, 4) : shift);
  }

  function nextSessionItem(st, profile) {
    const role = pickRole(st, profile);
    let b = targetB(st, profile, role);
    let skill, reason;

    if (role === 'retry') {
      const r = st.retryQueue.shift();
      skill = SK.byId[r.skill];
      b = Math.min(r.b - 2, b);
      reason = `Came back to ${skill.name.toLowerCase()} after a miss.`;
    } else if (role === 'review') {
      const pool = masteredSkills(profile);
      skill = pool.slice().sort((a, c) => (profile.skills[a.id]?.last || 0) - (profile.skills[c.id]?.last || 0))[Math.min(pool.length - 1, U.int(0, 1))];
      b = U.lerp(skill.lo, skill.hi, 0.6 + U.rand() * 0.4);
    } else {
      skill = chooseSkill(b, st.recent, profile);
    }
    if (role === 'ease') reason = st.consecWrong >= 2 ? 'Two misses in a row, so the next one is a confidence builder.' : 'Frustration signals rising, so the next one is a confidence builder.';
    if (role === 'challenge') reason = st.lastForced ? 'Asked for harder after a quick, unaided answer, so a challenge problem is up.' : 'Answers are fast and accurate, so a challenge problem is up.';
    st.lastForced = false;

    const item = SK.makeItem(skill, b);
    item.role = role;
    item.pBefore = P(profile.theta, item.b);
    // Tell the child when it's getting harder (never announce "easier").
    item.harder = st.lastB != null && item.b - st.lastB >= 3 && !['warmup', 'review', 'finisher', 'ease'].includes(role);
    st.lastB = item.b;
    if (reason) st.log.push({ i: st.idx, type: role === 'challenge' ? 'boost' : 'ease', text: reason });
    return item;
  }

  function recordSessionAnswer(st, profile, item, r) {
    const exp = expectedTime(item, profile);
    const t = Math.min(r.time, exp * 4); // idle time shouldn't swamp the model
    const ratio = r.time / exp;
    const p = P(profile.theta, item.b);
    const score = scoreOf(r, item, profile);
    const K = profile.sessions.length < 3 ? 4 : 2.5;
    const thetaBefore = profile.theta;
    profile.theta = U.clamp(profile.theta + K * 2 * (score - p), 0, 100);

    // Staircase: after every answer, move toward the mode's target.
    const outcome = r.correct && !r.skipped ? 1 : 0;
    const stairBefore = st.stair;
    st.stair = U.clamp(st.stair + STEP * (outcome - st.target), -12, 16);
    // A skip is a clear "too hard" signal: step down further.
    if (r.skipped) {
      st.stair = U.clamp(st.stair - 3, -12, 16);
      st.log.push({ i: st.idx, type: 'ease', text: 'Skipped, so the next problem steps down.' });
    }
    // Hot streaks turn it up faster (gently in "Take it easy").
    if (outcome && st.consecRight >= 2 && st.target <= 0.8) st.stair = Math.min(16, st.stair + 3 * (1 - st.target));

    if (r.correct && !r.hinted && r.time < exp * 4) {
      profile.speed = U.clamp(Math.exp(0.85 * Math.log(profile.speed || 1) + 0.15 * Math.log(Math.max(0.2, t / item.expected))), 0.5, 3);
    }

    const ks = skillStat(profile, item.skillId);
    ks.n++; if (r.correct) ks.correct++;
    ks.acc = ks.acc * 0.7 + (r.correct ? 0.3 : 0); ks.last = Date.now();

    // Engagement signals. In "Let's do this!" misses are expected, so they weigh less.
    const missW = st.target <= 0.6 ? 0.6 : st.target >= 0.9 ? 1.2 : st.target <= 0.72 ? 0.85 : 1;
    let F = st.F * 0.7, B = st.B * 0.72;
    const flags = [];
    const hardRole = ['stretch', 'challenge'].includes(item.role);
    if (r.skipped) { F += 0.3 * missW; flags.push('skipped'); }
    else if (!r.correct) {
      F += (hardRole ? 0.16 : 0.32) * missW;
      if (ratio < 0.3 && r.time < 4) { F += 0.15; flags.push('rapid guess'); }
    }
    if (r.hinted) { F += 0.08; flags.push('hint'); }
    if (r.time > 90) flags.push('long pause');
    if (r.correct && ratio > 2.5) { F += 0.1; flags.push('slow'); }
    if (r.correct && !r.hinted && ratio < 0.6 && item.role !== 'challenge') { B += 0.3; flags.push('fast'); }
    if (r.correct && ['warmup', 'review', 'ease', 'finisher'].includes(item.role) && ratio < 1) B += 0.12;
    if (r.correct && hardRole) { F -= 0.12; B -= 0.15; }

    st.consecWrong = r.correct ? 0 : st.consecWrong + 1;
    st.consecRight = r.correct ? st.consecRight + 1 : 0;
    if (st.consecWrong >= 2 && st.target > 0.6) F = Math.max(F, 0.6);
    if (st.consecWrong >= 3) F = Math.max(F, 0.6);
    if (st.consecRight >= 4 && ratio < 1) B = Math.max(B, 0.55);
    st.F = U.clamp(F, 0, 1); st.B = U.clamp(B, 0, 1);
    st.peakF = Math.max(st.peakF, st.F); st.peakB = Math.max(st.peakB, st.B);

    let retryQueued = false;
    if (!r.correct && item.role !== 'retry' && (!hardRole || st.mode === 'easy') && st.idx + 3 < st.len) {
      st.retryQueue.push({ skill: item.skillId, b: item.b, at: st.idx + 2 });
      retryQueued = true;
    }
    const aw = awardXP(profile, xpFor(item, r));
    st.xp += aw.xp;

    st.answers.push({
      i: st.idx, skill: item.skillId, role: item.role, b: U.fix(item.b, 1), p: U.fix(p, 2),
      correct: !!r.correct, skipped: !!r.skipped, hinted: !!r.hinted, time: U.fix(r.time, 1),
      expected: U.fix(exp, 1), F: U.fix(st.F, 2), B: U.fix(st.B, 2), theta: U.fix(profile.theta, 1),
      thetaBefore: U.fix(thetaBefore, 1), stair: U.fix(st.stair, 1), flags,
    });
    st.recent.push(item.skillId);
    st.idx++;
    // Did the answers after "Make it harder" back it up?
    st.harderChecks = st.harderChecks.filter((c) => {
      if (st.idx - c.at < 2) return true;
      const next = st.answers.slice(c.at, c.at + 2);
      const misses = next.filter((a) => !a.correct).length;
      const before = profile.harderTrust == null ? 1 : profile.harderTrust;
      if (misses === 2) profile.harderTrust = Math.max(0.3, before * 0.6);
      else if (misses === 1) profile.harderTrust = Math.max(0.3, before * 0.85);
      else profile.harderTrust = Math.min(1, before + 0.1);
      profile.harderTrust = U.fix(profile.harderTrust, 3);
      if (misses === 2) st.log.push({ i: c.at + 1, type: 'ease', text: 'Both answers after "Make it harder" were misses, so the button counts for less next time.' });
      else if (misses === 0 && before < 1) st.log.push({ i: c.at + 1, type: 'info', text: 'Answers after "Make it harder" backed it up, so the button earns back trust.' });
      return false;
    });
    return { F: st.F, B: st.B, score, xp: aw.xp, levelUp: aw.levelUp, retryQueued, streak: st.consecRight, stairUp: st.stair > stairBefore };
  }

  function sessionDone(st) { return st.idx >= st.len; }

  /* "Make it harder" (offered only right after a correct answer). Its
     weight depends on how that answer went, scaled by how well past
     requests were backed up by the answers that followed. */
  function requestHarder(st, profile) {
    const a = st.answers[st.answers.length - 1];
    if (!a || !a.correct || a.askedHarder || st.idx >= st.len) return null;
    const ratio = a.time / a.expected;
    const trust = profile.harderTrust == null ? 1 : profile.harderTrust;
    let kind, step;
    if (!a.hinted && ratio < 0.8) { kind = 'big'; step = 6; if (trust >= 0.6) st.forceChallenge = true; }
    else if (!a.hinted && ratio < 1.5) { kind = 'medium'; step = 3.5; }
    else { kind = 'small'; step = 1.5; }
    const applied = U.fix(step * trust, 2);
    st.stair = U.clamp(st.stair + applied, -12, 16);
    st.B = Math.max(0, st.B - 0.2); // the ask itself addresses boredom
    a.askedHarder = kind;
    st.harderChecks.push({ at: st.idx });
    const why = kind === 'big' ? 'fast, no hint: big step up' + (st.forceChallenge ? ' and a challenge next' : '')
      : kind === 'medium' ? 'normal pace: medium step up' : (a.hinted ? 'used a hint' : 'slow answer') + ': small step up';
    st.log.push({ i: a.i, type: 'boost', text: `Asked to make it harder (${why}${trust < 1 ? `, trust ${Math.round(trust * 100)}%` : ''}).` });
    return { kind, step: applied };
  }

  // Close a session (finished or abandoned) and adapt for next time.
  function finishSession(st, profile, opts) {
    opts = opts || {};
    const now = opts.now || Date.now();
    const answered = st.answers.filter((a) => !a.skipped);
    const nCorrect = st.answers.filter((a) => a.correct).length;
    const acc = st.answers.length ? nCorrect / st.answers.length : 0;
    const completed = !!opts.completed;
    const feel = opts.feel || null;
    const changes = [];

    if (st.answers.length === 0 && !completed) return null; // opened and closed, nothing to learn

    // Carry part of the in-session staircase into the ability estimate
    // so the next session starts where this one ended.
    if (Math.abs(st.stair) > 2) {
      const carry = st.stair * 0.35;
      profile.theta = U.clamp(profile.theta + carry, 0, 100);
      changes.push(carry > 0 ? 'Next session starts a notch harder' : 'Next session starts a notch easier');
    }

    // Challenge dial: engagement preference, separate from ability.
    let dOff = 0;
    if (!completed) dOff -= st.peakF > 0.5 || acc < st.target - 0.2 ? 3 : 1.5;
    else if (feel === 'hard') dOff -= 2;
    else if (feel === 'easy') dOff += 2;
    else if (acc >= st.target + 0.15 && st.peakB >= 0.5) dOff += 1.5;
    else if (feel === 'right') dOff += (0 - profile.offset) * 0.15;
    profile.offset = U.fix(U.clamp(profile.offset + dOff, -10, 10), 2);
    if (Math.abs(dOff) >= 1) changes.push(dOff > 0 ? 'Challenge dial up' : 'Challenge dial down');

    // Grade-row nudge: the child's own signals move their targets up to one
    // grade row harder or gentler than their enrolled grade.
    const beforeN = profile.nudge || 0;
    const rowDown = !completed || feel === 'hard' || acc < st.target - 0.15;
    const rowUp = !rowDown && (feel === 'easy' || (acc >= st.target + 0.1 && st.peakB >= 0.5) || st.answers.filter((a) => a.askedHarder === 'big').length >= 2);
    if (rowDown) profile.nudge = U.fix(U.clamp(beforeN - 1 / 3, -1, 1), 3);
    else if (rowUp) profile.nudge = U.fix(U.clamp(beforeN + 1 / 3, -1, 1), 3);
    if (profile.nudge !== beforeN) changes.push(`Success targets ${profile.nudge > beforeN ? 'one step harder' : 'one step gentler'} (${nudgeLabel(profile)})`);

    let levelUp = 0;
    if (completed) { const aw = awardXP(profile, XP.session); st.xp += aw.xp; levelUp = aw.levelUp; }
    const rec = {
      xp: st.xp, levelUp, mode: st.mode, target: st.target, grade: profile.grade, nudge: profile.nudge || 0,
      harderAsks: st.answers.filter((a) => a.askedHarder).length,
      id: st.id, start: st.start, end: now, completed, feel, planned: st.len,
      n: st.answers.length, correct: nCorrect, acc: U.fix(acc, 3),
      avgRatio: U.fix(U.mean(answered.map((a) => a.time / a.expected)), 2),
      peakF: U.fix(st.peakF, 2), peakB: U.fix(st.peakB, 2),
      eases: st.log.filter((l) => l.type === 'ease').length,
      boosts: st.log.filter((l) => l.type === 'boost').length,
      ups: st.answers.filter((a, i) => i > 0 && a.b - st.answers[i - 1].b >= 3).length,
      theta: U.fix(profile.theta, 2), offset: profile.offset, answers: st.answers, log: st.log, changes,
    };
    rec.story = narrative(rec);
    profile.sessions.push(rec);
    profile.history.push({ t: now, theta: profile.theta, kind: 'session' });
    return rec;
  }

  /* ---------------- Positive session story ---------------- */
  function narrative(rec) {
    const as = rec.answers || [];

    let quit = false;
    while (!E.sessionDone(st)) {
      const item = E.nextSessionItem(st, profile);
      E.recordSessionAnswer(st, profile, item, answer(learner, item));

    const frames = [];
    const chunk = (list) => { for (let i = 0; i < list.length; i += 10) frames.push(list.slice(i, i + 10)); };
    if (st.pack) chunk(st.groups.flatMap((g) => Array.from({ length: g.n }, () => g)));
    else st.groups.forEach((g) => g.n && chunk(Array.from({ length: g.n }, () => g)));
    let k = 0;
    const html = `<div class="wb-dots">${frames.map((f) => `<div class="wb-frame">${f.map((g) => `<i class="seq${g.crossed ? ' x' : ''}" style="--t:${k++};background:${INK[g.c] || INK[1]}"></i>`).join('')}${'<b></b>'.repeat(10 - f.length)}</div>`).join('')}</div>`;
    return [html.replace(/--t:(\d+)/g, (m, n) => `--t:${(n * 0.06).toFixed(2)}`), Math.min(k, 24) * 60 + 700];
  }

  function numberLine(st) {
    const W = 560, pad = 26, axis = 72;
    const range = st.max - st.min;
    const x = (v) => pad + ((v - st.min) / range) * (W - 2 * pad);
    const step = range <= 20 ? 1 : range <= 50 ? 5 : 10;
    const labelEvery = range <= 12 ? 1 : range <= 20 ? 2 : step;
    let svg = `<line x1="${pad - 10}" y1="${axis}" x2="${W - pad + 10}" y2="${axis}" class="wb-stroke"/>`;
    const markVals = st.marks.map((m) => m.v).concat(st.hops.map((h) => h.to));
    for (let v = Math.ceil(st.min / step) * step; v <= st.max; v += step) {
      svg += `<line x1="${x(v)}" y1="${axis - 7}" x2="${x(v)}" y2="${axis + 7}" class="wb-stroke thin"/>`;
      if (v % labelEvery === 0 && !markVals.some((mv) => mv !== v && Math.abs(x(mv) - x(v)) < 16)) svg += `<text x="${x(v)}" y="${axis + 26}" class="wb-tick">${v}</text>`;
    }
    st.marks.forEach((m) => {
      svg += `<circle cx="${x(m.v)}" cy="${axis}" r="7" style="fill:${INK[m.c]}"/><text x="${x(m.v)}" y="${axis + 27}" class="wb-tick strong" style="fill:${INK[m.c]}">${m.v}</text>`;
    });
    st.hops.forEach((hp, i) => {
      const x1 = x(hp.from), x2 = x(hp.to), hgt = Math.min(46, 16 + Math.abs(x2 - x1) * 0.35);
      const delay = (0.2 + i * 0.42).toFixed(2);
      svg += `<path d="M${x1} ${axis - 4} Q${(x1 + x2) / 2} ${axis - 4 - hgt * 2} ${x2} ${axis - 4}" pathLength="1" class="wb-hop" style="stroke:${INK[hp.c]};--d:${delay}s"/>`;
      svg += `<text x="${(x1 + x2) / 2}" y="${axis - hgt - 10}" class="wb-hoplabel seq" style="fill:${INK[hp.c]};--t:${delay}">${hp.label}</text>`;
      svg += `<circle cx="${x2}" cy="${axis}" r="4.5" class="seq" style="fill:${INK[hp.c]};--t:${(+delay + 0.35).toFixed(2)}"/>`;
    });
    return [`<svg class="wb-line" viewBox="0 0 ${W} 110" role="img" aria-label="number line">${svg}</svg>`, st.hops.length * 420 + 800];
  }

  // Column arithmetic with animated carries (+) and trades (−), decimals too.
  function column(st) {
    const p = st.places || 0, f = 10 ** p;
    const A = Math.round(st.top * f), B = Math.round(st.bottom * f);
    const R = st.op === '+' ? A + B : A - B;
    const minLen = p + 1;
    const W = Math.max(String(A).length, String(B).length, String(R).length, minLen);
    const pad = (n) => String(n).padStart(Math.max(String(n).length, minLen), '0').padStart(W, ' ').split('').map((c) => (c === ' ' ? null : +c));
    const a = pad(A), b = pad(B);
    const res = Array(W).fill(null), above = Array(W).fill(null), struck = Array(W).fill(false), tRes = Array(W).fill(0), tAbove = Array(W).fill(0);
    let order = 0;

      for (let i = W - 1; i >= 0; i--) {
        const s = (a[i] || 0) + (b[i] || 0) + carry;
        carry = s >= 10 ? 1 : 0;

        if (carry && i > 0) { above[i - 1] = 1; tAbove[i - 1] = order; }

    } else {
      const t = a.map((d) => d || 0);
      for (let i = W - 1; i >= 0; i--) {
        if (t[i] < (b[i] || 0) && i > 0) {
          t[i] += 10; t[i - 1] -= 1;
          above[i] = t[i]; struck[i] = true; tAbove[i] = order;
          above[i - 1] = t[i - 1]; struck[i - 1] = true; tAbove[i - 1] = order;
        } else if (struck[i]) { above[i] = t[i]; }
        res[i] = t[i] - (b[i] || 0); tRes[i] = order + 0.5;
        order++;

      // hide leading zeros of the result (keep the one before a decimal point)
      for (let i = 0; i < W - 1 - p; i++) { if (res[i] === 0) res[i] = null; else break; }
    }
    const pointAt = p ? W - p : -1; // index of first digit after the point
    const cols = [];
    const cell = (v, cls, t) => `<span class="${cls}${t != null ? ' seq' : ''}"${t != null ? ` style="--t:${(t * 0.65 + 0.3).toFixed(2)}"` : ''}>${v == null ? '' : v}</span>`;

    const nCols = W + (p ? 1 : 0) + 1;
    let html = `<div class="wb-col" style="grid-template-columns: .8em repeat(${nCols - 1}, auto)">`;
    html += '<span></span>' + rowCells((k, i) => k === 'pt' ? '<span class="pt"></span>' : above[i] == null ? '<span class="sm"></span>' : cell(above[i], 'sm mk4', tAbove[i]));
    html += '<span></span>' + rowCells((k, i) => k === 'pt' ? '<span class="pt">.</span>' : `<span class="${struck[i] ? 'strike' : ''}">${a[i] == null ? '' : a[i]}${struck[i] ? `<i class="seq" style="--t:${(tAbove[i] * 0.65 + 0.3).toFixed(2)}"></i>` : ''}</span>`);
    html += `<span class="op">${st.op}</span>` + rowCells((k, i) => k === 'pt' ? '<span class="pt">.</span>' : `<span>${b[i] == null ? '' : b[i]}</span>`);

    html += '<span></span>' + rowCells((k, i) => k === 'pt' ? cell('.', 'pt mk3', tRes[W - 1]) : cell(res[i], 'mk3', res[i] == null ? null : tRes[i]));

  }

  function arrayStep(st) {
    let k = 0;
    const rows = Array.from({ length: st.rows }, (_, r) => `<div class="wb-arow seq" style="--t:${(r * 0.25).toFixed(2)}">${'<i></i>'.repeat(st.cols)}</div>`).join('');
    return [`<div class="wb-array">${rows}</div>`, st.rows * 250 + 700 + k];
  }

  function area(st) {
    const cells = [];
    let t = 0;
    let html = `<div class="wb-area" style="grid-template-columns: auto repeat(${st.cols.length}, minmax(62px, 1fr))"><span></span>`;
    st.cols.forEach((c) => { html += `<span class="hd mk1">${c}</span>`; });
    st.rows.forEach((r) => {
      html += `<span class="hd side mk2">${r}</span>`;
      st.cols.forEach((c) => { html += `<span class="cell"><b class="seq mk3" style="--t:${(0.3 + t * 0.55).toFixed(2)}">${r * c}</b><small>${r} × ${c}</small></span>`; t++; cells.push(r * c); });
    });

    return [html, t * 550 + 900];
  }

  function bars(st) {
    let t = 0;
    const html = `<div class="wb-bars">${st.bars.map((b) => {
      const cells = [];
      let filled = 0;
      b.fills.forEach((f) => { for (let i = 0; i < f.n; i++) cells.push({ c: f.c, t: t++ }); filled += f.n; });
      for (let i = filled; i < b.parts; i++) cells.push(null);
      return `<div class="wb-bar" style="grid-template-columns: repeat(${b.parts}, 1fr)">${cells.map((c) => `<span${c ? ` class="seq" style="--t:${(c.t * 0.12 + 0.2).toFixed(2)};background:${INK[c.c]}"` : ''}>${b.labels != null ? `<em>${b.labels}</em>` : ''}</span>`).join('')}</div>`;
    }).join('')}</div>`;
    return [html, Math.min(t, 20) * 120 + 800];
  }

  function pie(st) {
    const R = 58, cx = 64, cy = 64;
    let svg = '';
    for (let i = 0; i < st.parts; i++) {
      const a0 = (i / st.parts) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / st.parts) * 2 * Math.PI - Math.PI / 2;
      const p0 = [cx + R * Math.cos(a0), cy + R * Math.sin(a0)], p1 = [cx + R * Math.cos(a1), cy + R * Math.sin(a1)];
      svg += `<path d="M${cx},${cy} L${p0[0].toFixed(1)},${p0[1].toFixed(1)} A${R},${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${p1[0].toFixed(1)},${p1[1].toFixed(1)} Z" class="${i < st.shaded ? 'seq' : ''}" style="fill:${i < st.shaded ? 'var(--m2)' : 'transparent'};stroke:var(--mk);stroke-width:3;stroke-linejoin:round;--t:${(i * 0.18 + 0.2).toFixed(2)}"/>`;
    }

  }

  function base10(st) {
    const rods = Array.from({ length: st.tens }, (_, i) => `<span class="rod seq" style="--t:${(i * 0.12).toFixed(2)}">${'<i></i>'.repeat(10)}</span>`).join('');
    const cubes = Array.from({ length: st.ones }, (_, i) => `<i class="cube seq" style="--t:${(st.tens * 0.12 + i * 0.08 + 0.2).toFixed(2)}"></i>`).join('');
    return [`<div class="wb-b10"><div class="rods">${rods}</div><div class="cubes">${cubes}</div></div>`, st.tens * 120 + st.ones * 80 + 800];
  }

  function place(st) {
    return [`<div class="wb-place">${st.cols.map(([name, v, c], i) => `<div><small>${name}</small><b class="seq mk${c}" style="--t:${(i * 0.3 + 0.2).toFixed(2)}">${v}</b></div>`).join('')}</div>`, st.cols.length * 300 + 800];
  }

  // Decimal point hopping right: 2.25 × 1000 -> 2250
  function shift(st) {
    const [ip, fp = ''] = st.num.split('.');
    let digits = (ip + fp).split('');
    const p0 = ip.length, p1 = p0 + st.places;
    const extra = Math.max(0, p1 - digits.length);
    digits = digits.concat(Array(extra).fill('0'));
    const bw = 46, pad = 20, y = 60;
    const W = pad * 2 + digits.length * bw;
    const xAfter = (i) => pad + i * bw;
    let svg = '';
    digits.forEach((d, i) => {
      const zero = i >= digits.length - extra;
      svg += `<rect x="${xAfter(i) + 3}" y="${y - 38}" width="${bw - 6}" height="48" rx="8" class="wb-box${zero ? ' seq' : ''}" style="--t:${(st.places * 0.5 + 0.2).toFixed(2)}"/>`;
      svg += `<text x="${xAfter(i) + bw / 2}" y="${y}" class="wb-digit${zero ? ' seq' : ''}" style="${zero ? 'fill:var(--m4);' : ''}--t:${(st.places * 0.5 + 0.2).toFixed(2)}">${d}</text>`;
    });
    svg += `<circle cx="${xAfter(p0)}" cy="${y + 4}" r="5.5" class="wb-oldpt"/>`;
    for (let j = 0; j < st.places; j++) {
      const x1 = xAfter(p0 + j), x2 = xAfter(p0 + j + 1), d = (0.2 + j * 0.5).toFixed(2);
      svg += `<path d="M${x1} ${y + 12} Q${(x1 + x2) / 2} ${y + 44} ${x2} ${y + 12}" pathLength="1" class="wb-hop" style="stroke:var(--m2);--d:${d}s"/>`;
      svg += `<text x="${(x1 + x2) / 2}" y="${y + 50}" class="wb-hoplabel seq" style="fill:var(--m2);--t:${d}">${j + 1}</text>`;
    }
    svg += `<circle cx="${xAfter(p1)}" cy="${y + 4}" r="6.5" class="seq" style="fill:var(--m3);--t:${(st.places * 0.5 + 0.3).toFixed(2)}"/>`;
    return [`<svg class="wb-shift" viewBox="0 0 ${W} 120" style="max-width:${W}px" role="img" aria-label="decimal point moves ${st.places} places right">${svg}</svg>`, st.places * 500 + 1000];
  }

  function stepHTML(st) {
    switch (st.t) {
      case 'say': return [`<p class="wb-say">${rich(st.s)}</p>`, Math.min(2200, 700 + plain(st.s).length * 22)];
      case 'eq': return [`<p class="wb-eq">${rich(st.s)}</p>`, Math.min(2000, 700 + plain(st.s).length * 30)];
      case 'dots': return dots(st);
      case 'line': return numberLine(st);
      case 'column': return column(st);
      case 'array': return arrayStep(st);
      case 'area': return area(st);
      case 'bars': return bars(st);
      case 'pie': return pie(st);
      case 'base10': return base10(st);

  /* ---------- player ---------- */
  function create(steps, opts) {

      <div class="wb-tray"><span class="wb-marker m1"></span><span class="wb-marker m2"></span><span class="wb-marker m3"></span><span class="wb-eraser"></span>
      <div class="wb-ctl"><button type="button" class="wb-btn" data-act="replay">↻ Replay</button><button type="button" class="wb-btn" data-act="all">Show all</button></div></div>`;

    let timer = null, i = 0;
    const show = (k) => { els[k].classList.add('on'); if (opts.onStep) opts.onStep(k); };
    function tick() {
      if (i >= els.length) { wrap.classList.add('done'); return; }

  MP.Whiteboard = { create, rich };
})(typeof window !== 'undefined' ? window : globalThis);

/* Local persistence. One JSON blob in localStorage, with an in-memory
   fallback when storage is blocked. Swap this file for Capacitor
   Preferences or SQLite when packaging for the app stores. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const KEY = 'numera.v1';
  const OLD_KEYS = ['mathpath.v1']; // data saved before the rename to Numera
  let memory = null;

  function load() {
    try {
      let raw = root.localStorage && root.localStorage.getItem(KEY);
      if (!raw && root.localStorage) {
        for (const k of OLD_KEYS) { raw = root.localStorage.getItem(k); if (raw) { root.localStorage.setItem(KEY, raw); break; } }
      }
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage blocked or corrupt: fall through */ }
    return memory || { v: 1, profiles: [], activeId: null, seededDemo: false };
  }

  function save(data) {
    memory = data;
    try { root.localStorage && root.localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  MP.Store = { load, save, KEY };
})(typeof window !== 'undefined' ? window : globalThis);

  function chartTrace(ses) {
    const as = ses.answers;
    const W = 560, H = 220, L = 58, R = 14, T = 16, B = 30;
    const vals = as.flatMap((a) => [a.b, a.thetaBefore != null ? a.thetaBefore : a.theta]);
    const lo = Math.min(...vals) - 4, hi = Math.max(...vals) + 4;
    const x = (i) => L + (as.length === 1 ? 0 : (i * (W - L - R)) / (as.length - 1));
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const els = [];
    [0, 0.5, 1].forEach((f) => els.push(s('line', { x1: L, x2: W - R, y1: T + f * (H - T - B), y2: T + f * (H - T - B), class: 'gridline' })));
    els.push(s('text', { x: L - 8, y: T + 10, 'text-anchor': 'end' }, 'harder'));
    els.push(s('text', { x: L - 8, y: H - B, 'text-anchor': 'end' }, 'easier'));
    els.push(s('path', { d: as.map((a, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(a.thetaBefore != null ? a.thetaBefore : a.theta).toFixed(1)}`).join(' '), class: 'line-theta' }));
    els.push(s('path', { d: as.map((a, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(a.b).toFixed(1)}`).join(' '), class: 'line-diff' }));
    const every = as.length > 12 ? 2 : 1;
    as.forEach((a, i) => {
      els.push(s('circle', { cx: x(i), cy: y(a.b), r: 6.5, class: a.skipped ? 'dot-skip' : a.correct ? 'dot-good' : 'dot-miss' }));
      if (a.askedHarder) els.push(s('text', { x: x(i), y: y(a.b) - 11, 'text-anchor': 'middle', class: 'flame' }, '🔥'));
      if (i % every === 0) els.push(s('text', { x: x(i), y: H - 10, 'text-anchor': 'middle' }, 'Q' + (i + 1)));
    });
    return s('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Problem difficulty, question by question' }, els);
  }

  function chartZone(p) {
    const ss = p.sessions.slice(-12);
    const W = 560, H = 210, L = 38, R = 12, T = 12, B = 26;
    const y = (v) => T + (1 - v) * (H - T - B);

      const t = ses.target || 0.75;
      const x0 = L + i * bw + bw * 0.14, w = bw * 0.72;

  function chartGrowth(p) {
    const pts = p.history.map((x) => x.theta);
    const W = 560, H = 230, L = 64, R = 12, T = 12, B = 24;
    const lo = Math.max(0, Math.min(...pts) - 8), hi = Math.min(100, Math.max(...pts) + 8);
    const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
