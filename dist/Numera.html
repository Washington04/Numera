:root {
  --bg-base: #F6F3FF; --bg1: #FFE7D6; --bg2: #E9E3FF; --bg3: #DDF1FF;
  --glass: rgba(255, 255, 255, .74); --glass-2: rgba(255, 255, 255, .55); --glass-border: rgba(255, 255, 255, .95); --card-solid: #FFFFFF;
  --ink: #1F1B3D; --ink-2: #5B5783; --ink-3: #8E8AB2; --line: rgba(31, 27, 61, .1);
  --p1: #FF9A5C; --p2: #FF4D8D; --p-edge: #D23A74;
  --good: #16A974; --good-soft: #D8F6E9;
  --sun: #F08C00; --sun-soft: #FFF0D6;
  --grape: #7C5CFF; --grape-soft: #ECE6FF;
  --sky: #3478F6; --sky-soft: #E1EDFF;
  --pink: #E0408A; --pink-soft: #FDE3F0;
  --key: #FFFFFF; --key-edge: rgba(84, 62, 170, .16);
  --shadow: 0 1px 2px rgba(50, 30, 120, .06), 0 14px 36px -12px rgba(60, 40, 150, .25);
  --r: 28px;
  --font: 'M PLUS Rounded 1c', ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --hand: 'Patrick Hand', 'Chalkboard SE', 'Comic Sans MS', ui-rounded, sans-serif;
  /* dry-erase markers */
  --wb-bg: #FDFEFF; --mk: #26243C; --m1: #1F6FEB; --m2: #E5337A; --m3: #0E9F5A; --m4: #F08C00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-base: #110F28; --bg1: #2B1A55; --bg2: #1B1446; --bg3: #0E2A4D;
    --glass: rgba(36, 31, 78, .7); --glass-2: rgba(255, 255, 255, .06); --glass-border: rgba(255, 255, 255, .1); --card-solid: #25204F;
    --ink: #F4F2FF; --ink-2: #BEB9E8; --ink-3: #8C87BA; --line: rgba(255, 255, 255, .12);
    --good: #34D399; --good-soft: #123B31; --sun: #FBBF24; --sun-soft: #3A2C10; --grape: #A78BFA; --grape-soft: #2B2257;
    --sky: #6AA5FF; --sky-soft: #172B52; --pink: #F472B6; --pink-soft: #3B1733;
    --key: #2C2760; --key-edge: rgba(0, 0, 0, .35);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-base: #110F28; --bg1: #2B1A55; --bg2: #1B1446; --bg3: #0E2A4D;
  --glass: rgba(36, 31, 78, .7); --glass-2: rgba(255, 255, 255, .06); --glass-border: rgba(255, 255, 255, .1); --card-solid: #25204F;
  --ink: #F4F2FF; --ink-2: #BEB9E8; --ink-3: #8C87BA; --line: rgba(255, 255, 255, .12);
  --good: #34D399; --good-soft: #123B31; --sun: #FBBF24; --sun-soft: #3A2C10; --grape: #A78BFA; --grape-soft: #2B2257;
  --sky: #6AA5FF; --sky-soft: #172B52; --pink: #F472B6; --pink-soft: #3B1733;
  --key: #2C2760; --key-edge: rgba(0, 0, 0, .35);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; font-weight: 500;
  background:
    radial-gradient(55vmax 55vmax at 0% -10%, var(--bg1), transparent 60%),
    radial-gradient(50vmax 50vmax at 105% 5%, var(--bg3), transparent 60%),
    radial-gradient(70vmax 50vmax at 50% 115%, var(--bg2), transparent 65%),
    var(--bg-base);
  background-attachment: fixed;
  padding-inline: 16px; padding-block: 0 48px; overflow-x: clip;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4.6vw, 40px); font-weight: 900; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 19px; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.lead { font-size: 19px; color: var(--ink-2); max-width: 46ch; }
.label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
.note { font-size: 13px; color: var(--ink-3); }
.center { text-align: center; }
.grad { background: linear-gradient(90deg, var(--grape), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.wrap { max-width: 820px; margin: 0 auto; }
.wrap.wide { max-width: 1120px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack.tight { gap: 8px; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 8px; }
.nowrap { flex-wrap: nowrap; }
.spread { justify-content: space-between; }
.top-align { align-items: flex-start; }
.end-align { align-items: flex-end; }
.end { align-items: flex-end; }
.grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid var(--glass-border); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 24px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 24px; letter-spacing: -0.03em; background: none; border: 0; padding: 0; }
.brand b { font-weight: 900; background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-mark { display: inline-flex; }
.beta-tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--glass-2); color: var(--ink-2); border: 1px solid var(--line); }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass); box-shadow: var(--shadow); font-size: 18px; display: grid; place-items: center; flex: none; }

/* Buttons */
.btn { border: 0; border-radius: 16px; padding: 11px 18px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  background: var(--card-solid); color: var(--ink); box-shadow: 0 3px 0 var(--key-edge), 0 8px 18px -12px rgba(60, 40, 150, .5); transition: transform .12s cubic-bezier(.3, 1.6, .5, 1), box-shadow .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 0 0 var(--key-edge); }
.btn.primary { color: #fff; background: linear-gradient(180deg, var(--p1), var(--p2)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), 0 4px 0 var(--p-edge), 0 14px 24px -10px rgba(255, 77, 141, .7); text-shadow: 0 1px 1px rgba(150, 20, 70, .35); }
.btn.big { font-size: 22px; padding: 15px 30px; border-radius: 20px; font-weight: 900; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--glass-2); color: var(--ink); }
.btn.quiet { background: var(--glass-2); box-shadow: none; }
.btn.danger { color: var(--pink); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; filter: saturate(.6); }
.link { background: none; border: 0; padding: 0; color: var(--sky); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 0; border-radius: 999px; background: var(--card-solid); padding: 9px 18px; font-weight: 800; min-width: 52px; box-shadow: 0 3px 0 var(--key-edge); }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--grape), var(--p2)); color: #fff; box-shadow: 0 3px 0 #6a2fb0, 0 10px 18px -10px rgba(124, 92, 255, .8); }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--card-solid); background: radial-gradient(circle at 35% 30%, #fff8 0 18%, transparent 40%), var(--c); box-shadow: 0 3px 0 var(--key-edge); }
.swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px; background: var(--glass-2); color: var(--ink-2); border: 1px solid var(--line); }
.badge.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge.sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge.grape { background: var(--grape-soft); color: var(--grape); border-color: transparent; }
.badge.sky { background: var(--sky-soft); color: var(--sky); border-color: transparent; }
.badge.pink { background: var(--pink-soft); color: var(--pink); border-color: transparent; }
.badge.hot { background: linear-gradient(90deg, #FF9A3C, #FF4D6D); color: #fff; border: 0; box-shadow: 0 6px 16px -8px #ff4d6d; }

.xp-pill { align-self: flex-start; display: inline-flex; align-items: center; font-weight: 900; font-size: 15px; padding: 6px 14px; border-radius: 999px; color: #fff; background: linear-gradient(135deg, var(--grape), var(--p2)); box-shadow: 0 6px 14px -8px rgba(124, 92, 255, .9); }
.xp-pill.soft { background: var(--grape-soft); color: var(--grape); box-shadow: none; font-size: 13px; }
.xp-chip { font-weight: 900; font-size: 15px; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); white-space: nowrap; }

/* Pip */
.pipwrap { display: inline-flex; line-height: 0; }
.pip { overflow: visible; }
.pip .pip-body { transform-origin: 60px 118px; }
.bob .pip-body { animation: bob 3.2s ease-in-out infinite; }
.jump .pip-body { animation: jump .8s cubic-bezier(.3, 1.5, .5, 1) both; }
.pip .pip-eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.pip-cheer .pip-eye, .pip-wow .pip-eye { animation: none; }
.pip-spark { animation: twinkle 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(.98, 1.02); } }
@keyframes jump { 0% { transform: translateY(0) scale(1.1, .88); } 40% { transform: translateY(-18px) scale(.94, 1.08); } 70% { transform: translateY(0) scale(1.06, .94); } 100% { transform: none; } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes twinkle { 50% { transform: scale(.6) rotate(20deg); opacity: .6; } }

/* Profiles */
.hero-title { display: flex; flex-direction: column; gap: 6px; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.player { display: flex; flex-direction: column; overflow: hidden; }
.player-main { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 16px 14px; background: none; border: 0; text-align: center; }
.player-main h3 { font-size: 22px; }
.lvl { font-weight: 900; color: var(--grape); font-size: 15px; }
.xpbar { width: 70%; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--grape), var(--p2)); }
.player .center { display: block; text-align: center; padding-bottom: 8px; }
.player-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.player-foot.confirm { flex-direction: column; align-items: stretch; text-align: center; background: var(--pink-soft); }
.player-foot.confirm .row { justify-content: center; }
.link.danger { color: var(--pink); }
.small-btn { padding: 7px 14px; font-size: 14px; }
.btn.danger-solid { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #a3245e; }
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.look { border: 2px solid transparent; border-radius: 18px; background: var(--glass-2); padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 13px; font-weight: 800; color: var(--ink-2); box-shadow: 0 3px 0 var(--key-edge); }
.look[aria-checked="true"] { border-color: var(--grape); background: var(--grape-soft); color: var(--grape); }
.player.add { border: 3px dashed var(--line); border-radius: var(--r); background: transparent; min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 900; color: var(--ink-2); font-size: 18px; }
.plus { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; color: #fff; background: linear-gradient(135deg, var(--p1), var(--p2)); box-shadow: 0 10px 20px -10px var(--p2); }

/* Add player */
.addcard { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; }
.preview { display: grid; place-items: center; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field input[type="text"] { border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; background: var(--card-solid); font-size: 22px; font-weight: 700; }
.field input[type="text"]:focus { border-color: var(--grape); outline: none; box-shadow: 0 0 0 4px var(--grape-soft); }

/* Home hero */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; position: relative; overflow: hidden; }
.hero-pip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero-main { min-width: 0; }
.bubble { position: relative; background: var(--card-solid); border-radius: 18px; padding: 10px 14px; font-weight: 800; font-size: 15px; max-width: 190px; text-align: center; box-shadow: var(--shadow); order: -1; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%) rotate(45deg); width: 16px; height: 16px; background: var(--card-solid); border-radius: 3px; }
.celebrate .hero-pip .burst { inset: -40px; }

/* Level ring */
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring-track { fill: none; stroke: var(--line); stroke-width: 10; }
.ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray .8s cubic-bezier(.3, 1.2, .5, 1); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-label small { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.ring-label b { font-size: 34px; font-weight: 900; }
.ring-label span { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-top: 3px; }

/* Mode picker */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode { border: 2px solid transparent; border-radius: 22px; background: var(--glass-2); padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; box-shadow: 0 3px 0 var(--key-edge); }
.mode b { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode span { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.mode[aria-checked="true"].m-easy { background: var(--good-soft); border-color: var(--good); }
.mode[aria-checked="true"].m-balanced { background: var(--sky-soft); border-color: var(--sky); }
.mode[aria-checked="true"].m-stretch { background: var(--pink-soft); border-color: var(--pink); }

/* Path */
.path { display: flex; justify-content: space-between; position: relative; padding-top: 4px; }
.path::before { content: ''; position: absolute; left: 10%; right: 10%; top: 50px; border-top: 4px dotted var(--line); }
.stop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; text-align: center; min-width: 0; }
.stop .here { font-size: 11px; font-weight: 900; color: var(--bg-base); background: var(--ink); padding: 2px 8px; border-radius: 99px; white-space: nowrap; height: 20px; }
.stop .here.ghost { visibility: hidden; }
.stop .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; background: radial-gradient(circle at 35% 30%, #ffffff88 0 15%, transparent 40%), var(--c); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 6px 12px -6px var(--c); }
.stop.now .dot { width: 56px; height: 56px; font-size: 22px; animation: pulse 2s ease-in-out infinite; }
.stop.next .dot { opacity: .35; filter: saturate(.5); }
.stop .name { font-size: 12px; font-weight: 800; color: var(--ink-2); line-height: 1.2; }
.stop.now .name { color: var(--ink); font-size: 13px; }
@keyframes pulse { 50% { box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 0 0 8px color-mix(in srgb, var(--c) 25%, transparent); } }

/* Streak */
.week { display: flex; gap: 6px; justify-content: space-between; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); font-weight: 800; flex: 1; }
.week .d i { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; font-style: normal; font-size: 18px; }
.week .d.on i { border: 0; background: linear-gradient(135deg, #FFD36B, #FF9A3C); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12), 0 6px 12px -8px #ff9a3c; }
.week .d.today { color: var(--ink); }
.week .d.today i { border-style: solid; border-color: var(--grape); color: var(--grape); font-weight: 900; }
.week .d.today.on i { border: 0; }
.week .d.future i { opacity: .6; }
.streakline { font-weight: 800; }
.story { font-size: 18px; line-height: 1.6; max-width: 70ch; }

/* Practice */
.practice { max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.ptop { display: flex; align-items: center; gap: 10px; }
.track { display: flex; gap: 4px; flex: 1; min-width: 0; }
.track span { flex: 1; height: 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-border); }
.track span.ok { border: 0; background: linear-gradient(180deg, #4BE0A4, var(--good)); }
.track span.miss { border: 0; background: linear-gradient(180deg, #FFD36B, #FFA53C); }
.track span.cur { border: 2px solid var(--grape); box-shadow: 0 0 0 3px var(--grape-soft); }
.meter { display: flex; align-items: flex-end; gap: 2px; height: 22px; padding: 0 2px; }
.meter i { width: 5px; border-radius: 3px; background: var(--line); }
.meter i.on { background: linear-gradient(180deg, #FF9A3C, #FF4D6D); }
.problem { padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; position: relative; min-height: 240px; justify-content: center; transition: box-shadow .3s; }
.problem.is-good { box-shadow: 0 0 0 3px var(--good), var(--shadow); }
.problem.is-close { box-shadow: 0 0 0 3px var(--sun), var(--shadow); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 28px; }
.problem .prompt { font-size: 21px; font-weight: 700; max-width: 32ch; }
.problem .display { font-weight: 900; font-size: clamp(40px, 9vw, 64px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.q { color: var(--p2); }
.column { font-weight: 900; font-size: clamp(40px, 9vw, 58px); line-height: 1.1; font-variant-numeric: tabular-nums; display: grid; grid-template-columns: auto auto; column-gap: 14px; text-align: right; }
.column .op { text-align: left; }
.column .rule { grid-column: 1 / -1; border-top: 5px solid var(--ink); border-radius: 3px; margin-top: 6px; }
.skillchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); font-weight: 700; }
.skillchip i { width: 12px; height: 12px; border-radius: 50%; }
.corner-pip { position: absolute; right: 10px; bottom: 6px; pointer-events: none; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .62em; line-height: 1.05; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .12em .04em; }
.fr > span:last-child { padding-top: .04em; }

/* Problem visuals */
.dots { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.frame { display: grid; grid-template-columns: repeat(5, 26px); gap: 6px; padding: 8px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); }
.frame i { width: 26px; height: 26px; border-radius: 50%; display: block; background: radial-gradient(circle at 35% 30%, #ffffffaa 0 18%, transparent 45%), var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15); }
.frame i.x { opacity: .35; position: relative; }
.frame i.x::after { content: ''; position: absolute; inset: 11px -3px; background: var(--ink); transform: rotate(-35deg); border-radius: 2px; }
.array { display: grid; gap: 6px; }
.array i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9 0 18%, transparent 45%), var(--sky); display: block; }
.base10 { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
.b10tens { display: flex; gap: 5px; }
.b10rod { display: grid; grid-template-rows: repeat(10, 11px); gap: 1px; background: #2f5fd0; padding: 1px; border-radius: 4px; }
.b10rod i, .b10ones i { display: block; width: 11px; height: 11px; background: #6ea6ff; }
.b10ones { display: grid; grid-template-columns: repeat(5, 11px); gap: 3px; }
.b10ones i { background: #ffa53c; border-radius: 2px; }
.fracsvg { width: 150px; height: auto; max-width: 100%; }
.fracsvg.bar { width: 280px; }

/* Answer */
.answer { display: flex; flex-direction: column; gap: 12px; }
.slot { min-height: 74px; border: 3px solid var(--line); border-radius: 22px; background: var(--card-solid); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; }
.slot.active { border-color: var(--grape); box-shadow: 0 0 0 5px var(--grape-soft); }
.slot .ph { color: var(--ink-3); font-size: 21px; font-weight: 600; }
.fracin { display: grid; grid-template-rows: auto 5px auto; gap: 8px; width: 170px; margin: 0 auto; }
.fracin .bar { background: var(--ink); border-radius: 3px; }
.fracin .slot { min-height: 60px; font-size: 32px; cursor: pointer; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { min-height: 60px; border-radius: 18px; border: 0; background: var(--key); font-size: 28px; font-weight: 900; box-shadow: 0 4px 0 var(--key-edge), 0 10px 18px -14px rgba(60, 40, 150, .6); transition: transform .1s cubic-bezier(.3, 1.6, .5, 1), box-shadow .1s; }
.key:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 var(--key-edge); }
.key.fn { font-size: 16px; color: var(--ink-2); background: var(--glass-2); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { min-height: 90px; font-size: 46px; font-weight: 900; border-radius: 22px; border: 0; background: var(--key); box-shadow: 0 5px 0 var(--key-edge); }
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--key-edge); }
.helpers { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.hintbox { padding: 14px 18px; font-size: 17px; text-align: left; border-radius: 20px; }

/* Feedback */
.fb { position: relative; overflow: hidden; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); border: 1px solid var(--glass-border); }
.fb.good { flex-direction: row; align-items: center; gap: 16px; background: linear-gradient(135deg, var(--good-soft), var(--glass)); }
.fb.good h2 { color: var(--good); font-size: 30px; }
.fb.close { background: linear-gradient(135deg, var(--sun-soft), var(--glass)); }
.fb.close h2 { color: var(--sun); font-size: 30px; }
.fb-head { display: flex; gap: 14px; align-items: center; }
.answer-reveal { font-size: 19px; }
.answer-reveal b { font-size: 24px; font-weight: 900; }
.fb > *:not(.burst) { position: relative; }
.burst { position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .55) 0 6deg, transparent 6deg 18deg); animation: spin 14s linear infinite; pointer-events: none; mask: radial-gradient(closest-side, #000 20%, transparent 75%); -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 75%); }
.fb.good .burst { inset: -80% auto -80% -30%; width: 110%; }
@keyframes spin { to { transform: rotate(360deg); } }
.float { animation: floatup 1.2s ease-out both; }
@keyframes floatup { 0% { transform: translateY(12px) scale(.8); opacity: 0; } 30% { transform: translateY(-4px) scale(1.08); opacity: 1; } 100% { transform: none; } }
.wbhost { display: flex; flex-direction: column; gap: 8px; }
.hot-btn { color: #fff; background: linear-gradient(135deg, #FF9A3C, #FF4D6D); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), 0 3px 0 #c8324f, 0 10px 18px -10px #ff4d6d; }
.harder-note { font-weight: 900; color: #F0503C; }
.flame { font-size: 13px; }
.wb-title { font-size: 20px; }

/* Dry-erase whiteboard */
.wb { border-radius: 22px; padding: 10px 10px 0; background: linear-gradient(180deg, #EEF1F6, #C9D0DB); box-shadow: 0 1px 0 #fff inset, 0 18px 30px -18px rgba(30, 30, 60, .55); color-scheme: light; }
.wb-board { position: relative; background:
    radial-gradient(120px 40px at 80% 20%, rgba(120, 140, 170, .06), transparent 70%),
    radial-gradient(160px 50px at 20% 80%, rgba(120, 140, 170, .05), transparent 70%), var(--wb-bg);
  border-radius: 14px; padding: 18px 20px; min-height: 150px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06), inset 0 10px 24px -18px rgba(0, 0, 0, .25);
  font-family: var(--hand); color: var(--mk); display: flex; flex-direction: column; gap: 10px; overflow-x: auto; }
.wb-tray { display: flex; align-items: center; gap: 8px; padding: 8px 6px 10px; }
.wb-marker { width: 34px; height: 10px; border-radius: 6px 3px 3px 6px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .2); }
.wb-marker.m1 { background: var(--m1); } .wb-marker.m2 { background: var(--m2); } .wb-marker.m3 { background: var(--m3); }
.wb-eraser { width: 34px; height: 14px; border-radius: 4px; background: linear-gradient(180deg, #3b3b52 0 45%, #d9d6cc 45%); }
.wb-ctl { margin-left: auto; display: flex; gap: 6px; }
.wb-btn { border: 0; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 800; background: rgba(255, 255, 255, .8); color: #33304f; font-family: var(--font); }
.wb-step { display: none; }
.wb-step.on { display: block; }
.wb-say { font-size: 23px; line-height: 1.3; }
.wb-eq { font-size: 34px; line-height: 1.25; }
.wb-step.on .wb-say, .wb-step.on .wb-eq { animation: write .9s steps(24) both; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.mk1 { color: var(--m1); } .mk2 { color: var(--m2); } .mk3 { color: var(--m3); } .mk4 { color: var(--m4); }
.wfr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .12em; }
.wfr > span:first-child { border-bottom: 3px solid currentColor; padding: 0 .15em .06em; }
.wfr > span:last-child { padding-top: .06em; }
.seq { opacity: 0; }
.wb-step.on .seq { animation: seqIn .35s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--t, 0) * 1s); }
@keyframes seqIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.wb-hop { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.wb-step.on .wb-hop { animation: draw .45s ease-out forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.wb.instant .wb-say, .wb.instant .wb-eq, .wb.instant .seq, .wb.instant .wb-hop { animation: none !important; opacity: 1; clip-path: none; stroke-dashoffset: 0; }
.wb-line, .wb-shift { width: 100%; max-width: 560px; height: auto; display: block; }
.wb-stroke { stroke: var(--mk); stroke-width: 3; stroke-linecap: round; }
.wb-stroke.thin { stroke-width: 2; }
.wb-tick { font-family: var(--hand); font-size: 17px; fill: var(--mk); text-anchor: middle; }
.wb-tick.strong { font-size: 20px; font-weight: 700; }
.wb-hoplabel { font-family: var(--hand); font-size: 17px; text-anchor: middle; }
.wb-dots { display: flex; gap: 14px; flex-wrap: wrap; }
.wb-frame { display: grid; grid-template-columns: repeat(5, 22px); gap: 5px; padding: 7px; border: 2.5px solid var(--mk); border-radius: 6px; }
.wb-frame i, .wb-frame b { width: 22px; height: 22px; border-radius: 50%; display: block; }
.wb-frame i.x { position: relative; opacity: .45; }
.wb-frame i.x::after { content: ''; position: absolute; inset: 9px -3px; background: var(--mk); transform: rotate(-35deg); border-radius: 2px; }
.wb-col { display: inline-grid; font-size: 40px; line-height: 1.15; column-gap: 6px; text-align: center; align-self: flex-start; margin-left: 8px; }

<main id="app"></main>
<noscript>Numera needs JavaScript turned on.</noscript>
<script>
/* Numera: small shared helpers. Classic script (no modules) so the app
   runs by double-clicking index.html, with no server or install. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = {};

  U.rand = Math.random;
  // Deterministic RNG for tests and demo data (mulberry32).
  U.seed = function (s) {
    let a = s >>> 0;
    U.rand = function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.unseed = function () { U.rand = Math.random; };

  U.int = (lo, hi) => lo + Math.floor(U.rand() * (hi - lo + 1));
  U.pick = (arr) => arr[Math.floor(U.rand() * arr.length)];
  U.chance = (p) => U.rand() < p;
  U.clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.lerpInt = (a, b, t) => Math.round(U.lerp(a, b, U.clamp(t, 0, 1)));
  U.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
  U.logistic = (x) => 1 / (1 + Math.exp(-x));
  U.logit = (p) => Math.log(p / (1 - p));
  U.uid = () => Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  U.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(U.rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  U.mean = (xs) => (xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : 0);
  U.median = (xs) => {
    if (!xs.length) return 0;
    const s = xs.slice().sort((a, b) => a - b);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  // Round away float noise: 0.1 + 0.2 -> 0.3
  U.fix = (x, places = 4) => Math.round(x * 10 ** places) / 10 ** places;
  U.fmtDec = (x) => String(U.fix(x));
  U.dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

  MP.U = U;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Numera skill ladder, K through grade 5.
   Every skill owns a band [lo, hi] on one internal 0-100 ability scale
   (never shown to children). A generator receives d in [0,1] (position
   inside the band) and returns a problem, including "wb": the whiteboard
   steps for a worked example.

   Whiteboard markup, used in say/eq strings:
     {1:text}   colored marker (1 blue, 2 pink, 3 green, 4 yellow)
     [a/b]      stacked fraction; a and b may contain colour tokens */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = MP.U;

  // Candy palette for skill identity (glossy chips, progress path).
  const TONE = ['#FF6B6B', '#FF9F43', '#FFC53D', '#3DDC97', '#4DABF7', '#9775FA', '#F783AC', '#20C997'];

  const NAMES = ['Maya', 'Leo', 'Ava', 'Sam', 'Noor', 'Kai', 'Zoe', 'Eli', 'Rosa', 'Theo', 'Ivy', 'Omar'];
  const THINGS = ['stickers', 'shells', 'marbles', 'crayons', 'apples', 'stamps', 'rocks', 'cards'];

  const C = (i, x) => `{${i}:${x}}`;
  const say = (s) => ({ t: 'say', s });
  const eq = (s) => ({ t: 'eq', s });
  const frac = (n, d) => ({ n, d });
  const fracStr = (f) => f.n + '/' + f.d;
  const F = (n, d) => `[${n}/${d}]`;
  // Number line with unit hops (or one big hop when there are many).
  function hops(from, n, dir, c) {
    const out = [];
    if (n <= 0) return out;
    if (n > 6) return [{ from, to: from + dir * n, c, label: (dir > 0 ? '+' : '−') + n }];
    for (let i = 0; i < n; i++) out.push({ from: from + dir * i, to: from + dir * (i + 1), c, label: (dir > 0 ? '+' : '−') + '1' });
    return out;
  }
  const line = (min, max, hopsArr, marks) => ({ t: 'line', min, max, hops: hopsArr || [], marks: marks || [] });
  const placeChart = (cols) => ({ t: 'place', cols });

  const skills = [
    {
      id: 'count', name: 'Counting', grade: 'K', lo: -10, hi: 10, t: 6,
      gen(d) {
        const n = U.int(U.lerpInt(1, 9, d), U.lerpInt(3, 20, d));
        const parts = Array(Math.floor(n / 5)).fill(5);
        if (n % 5) parts.push(n % 5);
        return {
          prompt: 'How many dots?', kind: 'int', answer: n,
          visual: { type: 'dots', groups: [{ n, tone: 4 }] },
          hint: 'Touch each dot as you count. Each full row has 5.',
          explain: `There are ${n} dots.`,
          wb: [
            { t: 'dots', groups: [{ n, c: 1 }] },
            n >= 5 ? say(`Each full row has ${C(1, 5)} dots.`) : say('Touch and count each dot.'),
            eq(n >= 5 ? `${parts.join(' + ')} = ${C(3, n)}` : `${Array.from({ length: n }, (_, i) => i + 1).join(', ')} … ${C(3, n)}`),
          ],
        };
      },
    },
    {
      id: 'compare', name: 'Bigger or smaller', grade: 'K', lo: 4, hi: 16, t: 5,
      gen(d) {
        const max = d < 0.3 ? 10 : d < 0.7 ? 30 : 100;
        const a = U.int(0, max);
        const b = U.chance(0.15) ? a : U.int(0, max);
        const ans = a < b ? '<' : a > b ? '>' : '=';
        const lo = Math.floor(Math.min(a, b) / 10) * 10, hi = Math.max(lo + 10, Math.ceil((Math.max(a, b) + 1) / 10) * 10);
        return {
          prompt: 'Which sign goes in the gap?', display: `${a}  ?  ${b}`, kind: 'choice',
          choices: ['<', '=', '>'], answer: ans,
          hint: 'The open side of < or > faces the bigger number.',
          explain: a === b ? `${a} and ${b} are the same, so =.` : `${Math.max(a, b)} is bigger, so ${a} ${ans} ${b}.`,
          wb: [
            line(lo, hi, [], [{ v: a, c: 1 }, { v: b, c: 2 }]),
            say(a === b ? 'They land on the same spot. Same number!' : 'On a number line, the one further right is bigger.'),
            a === b ? eq(`${C(1, a)} = ${C(2, b)}`) : eq(`${C(1, a)} ${C(3, ans)} ${C(2, b)}`),
            a === b ? say('Same amount, so we use =.') : say(`The open mouth faces ${C(a > b ? 1 : 2, Math.max(a, b))}, the bigger number.`),
          ],
        };
      },
    },
    {
      id: 'add10', name: 'Adding within 10', grade: 'K', lo: 8, hi: 20, t: 5,
      gen(d) {
        const s = U.int(U.lerpInt(3, 6, d), U.lerpInt(5, 10, d));
        const a = U.int(0, s), b = s - a, big = Math.max(a, b), small = Math.min(a, b);
        return {
          prompt: 'Add.', display: `${a} + ${b} = ?`, kind: 'int', answer: s,
          visual: d < 0.5 ? { type: 'dots', groups: [{ n: a, tone: 4 }, { n: b, tone: 6 }] } : null,
          hint: `Start at ${big} and count on ${small} more.`,
          explain: `${a} + ${b} = ${s}.`,
          wb: [
            { t: 'dots', groups: [{ n: a, c: 1 }, { n: b, c: 2 }] },
            say(`Start at the bigger number, ${C(a >= b ? 1 : 2, big)}. Count on ${C(a >= b ? 2 : 1, small)}.`),
            line(0, 10, hops(big, small, 1, 2), [{ v: big, c: 1 }]),
            eq(`${C(1, a)} + ${C(2, b)} = ${C(3, s)}`),
          ],
        };
      },
    },
    {
      id: 'sub10', name: 'Taking away within 10', grade: 'K', lo: 12, hi: 24, t: 6,
      gen(d) {
        const a = U.int(U.lerpInt(3, 6, d), U.lerpInt(6, 10, d));
        const b = U.int(1, a);
        return {
          prompt: 'Subtract.', display: `${a} − ${b} = ?`, kind: 'int', answer: a - b,
          visual: d < 0.5 ? { type: 'dots', groups: [{ n: a - b, tone: 4 }, { n: b, tone: 4, crossed: true }] } : null,
          hint: `Start at ${a} and count back ${b}.`,
          explain: `${a} take away ${b} leaves ${a - b}.`,
          wb: [
            { t: 'dots', groups: [{ n: a - b, c: 1 }, { n: b, c: 2, crossed: true }] },
            say(`Start with ${C(1, a)}. Take away ${C(2, b)}.`),
            line(0, 10, hops(a, b, -1, 2), [{ v: a, c: 1 }]),
            eq(`${C(1, a)} − ${C(2, b)} = ${C(3, a - b)}`),
          ],
        };
      },
    },
    {
      id: 'add20', name: 'Adding within 20', grade: '1', lo: 18, hi: 30, t: 6,
      gen(d) {
        let a, b;
        if (d < 0.35) { a = U.int(8, 15); b = U.int(1, 3); }
        else { a = U.int(U.lerpInt(5, 7, d), 9); b = U.int(Math.max(11 - a, 2), 9); }
        if (U.chance(0.5)) [a, b] = [b, a];
        const s = a + b, big = Math.max(a, b), small = Math.min(a, b);
        const need = 10 - big;
        const makeTen = big < 10 && small > need;
        const story = U.chance(0.25);
        const who = U.pick(NAMES), what = U.pick(THINGS);
        const wb = makeTen ? [
          { t: 'dots', pack: true, groups: [{ n: big, c: 1 }, { n: small, c: 2 }] },
          say(`Make a ten! ${C(1, big)} needs ${C(2, need)} more to fill the frame.`),
          eq(`${C(1, big)} + ${C(2, small)} = ${C(1, big)} + ${C(2, need)} + ${C(2, small - need)}`),
          eq(`= ${C(4, 10)} + ${C(2, small - need)} = ${C(3, s)}`),
        ] : [
          say(`Start at ${C(1, big)}. Count on ${C(2, small)}.`),
          line(Math.max(0, big - 2), Math.min(20, Math.max(big + small + 2, big + 8)), hops(big, small, 1, 2), [{ v: big, c: 1 }]),
          eq(`${C(1, big)} + ${C(2, small)} = ${C(3, s)}`),
        ];
        if (story) wb.unshift(say(`${who} starts with ${C(1, a)} and gets ${C(2, b)} more. "More" means add.`));
        return {
          prompt: story ? `${who} has ${a} ${what}. ${who} gets ${b} more. How many ${what} now?` : 'Add.',
          display: story ? null : `${a} + ${b} = ?`, kind: 'int', answer: s,
          hint: makeTen ? `Make a ten: ${big} + ${need} = 10.` : `Start at ${big} and count on ${small}.`,
          explain: `${a} + ${b} = ${s}.`, wb,
        };
      },
    },
    {
      id: 'sub20', name: 'Taking away within 20', grade: '1', lo: 22, hi: 34, t: 7,
      gen(d) {
        const a = U.int(11, U.lerpInt(14, 20, d));
        const ones = a % 10;
        const b = d < 0.4 ? U.int(1, Math.max(1, ones)) : U.int(Math.min(ones + 1, 9), 9);
        const r = a - b;
        const bridge = b > ones && ones > 0;
        return {
          prompt: 'Subtract.', display: `${a} − ${b} = ?`, kind: 'int', answer: r,
          hint: `Think addition: ${b} + ? = ${a}.`,
          explain: `${a} − ${b} = ${r}.`,
          wb: bridge ? [
            say(`Take away ${C(2, b)} in two jumps. First jump to 10.`),
            line(Math.max(0, r - 1), a + 1, [{ from: a, to: 10, c: 2, label: '−' + ones }, { from: 10, to: r, c: 4, label: '−' + (b - ones) }], [{ v: a, c: 1 }]),

        const a = hundredths ? U.int(120, 950) / 100 : U.int(11, 89) / 10;
        const b = hundredths ? U.int(5, Math.floor(a * 10)) / 10 : U.int(11, 69) / 10;
        const sub = hundredths && U.chance(0.5) && a > b;
        const ans = U.fix(sub ? a - b : a + b);
        const places = hundredths ? 2 : 1;
        return {
          prompt: sub ? 'Subtract.' : 'Add.', display: `${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ?`,
          kind: 'dec', answer: ans,
          hint: 'Line up the decimal points, then add or subtract like whole numbers.',
          explain: `${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ${U.fmtDec(ans)}.`,
          wb: [
            say(`Line up the ${C(4, 'decimal points')}. Fill gaps with 0.`),
            { t: 'column', top: a, bottom: b, op: sub ? '−' : '+', places },
            say('The point in the answer drops straight down.'),
            eq(`${U.fmtDec(a)} ${sub ? '−' : '+'} ${U.fmtDec(b)} = ${C(3, U.fmtDec(ans))}`),
          ],
        };
      },
    },
    {
      id: 'fracmul', name: 'Fractions of a number', grade: '5', lo: 78, hi: 90, t: 18,
      gen(d) {
        if (d < 0.7) {
          const den = U.pick([2, 3, 4, 5, 6, 8]);
          const num = d < 0.35 ? 1 : U.int(2, den - 1);
          const whole = den * U.int(2, 9);
          const each = whole / den;
          return {
            prompt: `What is ${num}/${den} of ${whole}?`, kind: 'int', answer: each * num,
            hint: `First find 1/${den} of ${whole} by dividing by ${den}.`,
            explain: `${whole} ÷ ${den} = ${each}${num > 1 ? `, then × ${num} = ${each * num}` : ''}.`,
            wb: [
              say(`Split ${C(1, whole)} into ${C(2, den)} equal groups.`),
              { t: 'bars', bars: [{ parts: den, fills: [{ n: num, c: 3 }], labels: each }] },
              eq(`${C(1, whole)} ÷ ${C(2, den)} = ${C(4, each)} in each group`),
              num > 1 ? say(`Take ${C(3, num)} of the groups.`) : say('Take one group.'),
              eq(num > 1 ? `${C(3, num)} × ${C(4, each)} = ${C(3, each * num)}` : `${F(1, den)} of ${whole} = ${C(3, each)}`),
            ],
          };
        }
        const den = U.pick([3, 4, 5, 6, 8]), num = U.int(1, den - 1), w = U.int(2, 7);
        const g = U.gcd(num * w, den);
        return {
          prompt: 'Multiply. Any equal fraction is OK.', display: `${w} × ${num}/${den} = ?`, kind: 'frac',
          answer: frac(num * w / g, den / g),
          hint: 'Multiply the top number by the whole number. The bottom stays.',
          explain: `${w} × ${num} = ${w * num}, so ${w * num}/${den}.`,
          wb: [
            say(`${C(1, w)} × ${F(num, den)} means ${C(1, w)} groups of ${F(num, den)}.`),
            w <= 4 ? { t: 'bars', bars: Array.from({ length: w }, () => ({ parts: den, fills: [{ n: num, c: 2 }] })) } : null,
            eq(w <= 4 ? `${Array(w).fill(F(C(2, num), den)).join(' + ')} = ${F(C(3, num * w), den)}` : `${C(1, w)} × ${C(2, num)} = ${C(3, num * w)}`),
            say('The size of the parts (the bottom) stays the same.'),
            eq(`${C(1, w)} × ${F(C(2, num), den)} = ${F(C(3, num * w), den)}`),
          ].filter(Boolean),
        };
      },
    },
    {
      id: 'decmul', name: 'Multiplying decimals', grade: '5', lo: 84, hi: 96, t: 18,
      gen(d) {
        if (d < 0.35) {
          const a = U.fix(U.int(11, 999) / 100), p = U.pick([10, 100, 1000]);
          const k = String(p).length - 1;
          return {
            prompt: 'Multiply.', display: `${U.fmtDec(a)} × ${p} = ?`, kind: 'dec', answer: U.fix(a * p),
            hint: `× ${p} moves every digit ${k} place${k > 1 ? 's' : ''} to the left.`,
            explain: `${U.fmtDec(a)} × ${p} = ${U.fmtDec(a * p)}.`,
            wb: [
              say(`Times ${C(2, p)}: every digit gets ${C(2, p)} times bigger.`),
              say(`Same as hopping the decimal point ${C(2, k)} place${k > 1 ? 's' : ''} to the right.`),
              { t: 'shift', num: U.fmtDec(a), places: k },
              k > 1 && String(U.fix(a * p)).length > String(a).replace('.', '').replace(/^0+/, '').length ? say(`Run out of digits? Fill the empty places with ${C(4, 0)}.`) : null,
              eq(`${C(1, U.fmtDec(a))} × ${C(2, p)} = ${C(3, U.fmtDec(U.fix(a * p)))}`),
            ].filter(Boolean),
          };
        }
        const aT = U.int(2, 9), a = aT / 10;
        const whole = d < 0.7;
        const bRaw = U.int(2, 9), b = whole ? bRaw : bRaw / 10;
        const ans = U.fix(a * b);
        return {
          prompt: 'Multiply.', display: `${U.fmtDec(a)} × ${U.fmtDec(b)} = ?`, kind: 'dec', answer: ans,
          hint: 'Multiply as whole numbers, then count the decimal places in both numbers.',
          explain: `${U.fmtDec(a)} × ${U.fmtDec(b)} = ${U.fmtDec(ans)}.`,
          wb: whole ? [
            say(`${C(1, U.fmtDec(a))} is ${C(1, aT)} tenths.`),
            eq(`${C(1, aT)} tenths × ${C(2, b)} = ${C(4, aT * b)} tenths`),
            eq(`${C(4, aT * b)} tenths = ${C(3, U.fmtDec(ans))}`),
          ] : [
            say('Ignore the points and multiply.'),
            eq(`${C(1, aT)} × ${C(2, bRaw)} = ${C(4, aT * bRaw)}`),
            say(`Count decimal places: ${C(1, 1)} + ${C(2, 1)} = 2. The answer needs 2 places.`),
            eq(`${U.fmtDec(a)} × ${U.fmtDec(b)} = ${C(3, ans.toFixed(2))}`),
          ],
        };
      },
    },
    {
      id: 'ooo', name: 'Order of operations', grade: '5', lo: 86, hi: 100, t: 20,
      gen(d) {
        const a = U.int(2, 9), b = U.int(2, 9), c = U.int(2, 9);
        if (d < 0.4) {
          return {
            prompt: 'Solve. Multiply before you add.', display: `${a} + ${b} × ${c} = ?`, kind: 'int', answer: a + b * c,
            hint: 'Do × and ÷ first, then + and −.', explain: `${b} × ${c} = ${b * c}, then ${a} + ${b * c} = ${a + b * c}.`,
            wb: [say('Multiply first. Circle the ×.'), eq(`${a} + ${C(4, `${b} × ${c}`)}`), eq(`= ${a} + ${C(4, b * c)}`), eq(`= ${C(3, a + b * c)}`)],
          };
        }
        if (d < 0.75) {
          return {
            prompt: 'Solve. Brackets first.', display: `(${a} + ${b}) × ${c} = ?`, kind: 'int', answer: (a + b) * c,
            hint: 'Work inside the brackets first.', explain: `${a} + ${b} = ${a + b}, then × ${c} = ${(a + b) * c}.`,
            wb: [say('Brackets go first.'), eq(`${C(4, `(${a} + ${b})`)} × ${c}`), eq(`= ${C(4, a + b)} × ${c}`), eq(`= ${C(3, (a + b) * c)}`)],
          };
        }
        const e = U.int(2, 5), f = e * U.int(2, 6);
        const big = Math.max(a, b) + 1, small = Math.min(a, b);
        const p1 = (big - small) * c, p2 = f / e;
        return {
          prompt: 'Solve.', display: `(${big} − ${small}) × ${c} + ${f} ÷ ${e} = ?`, kind: 'int', answer: p1 + p2,
          hint: 'Brackets, then × and ÷ left to right, then + and −.',
          explain: `(${big} − ${small}) × ${c} + ${f} ÷ ${e} = ${p1 + p2}.`,
          wb: [
            say(`Order: ${C(4, 'brackets')}, then × and ÷, then + and −.`),
            eq(`${C(4, `(${big} − ${small})`)} × ${c} + ${f} ÷ ${e}`),
            eq(`= ${C(1, `${big - small} × ${c}`)} + ${C(2, `${f} ÷ ${e}`)}`),
            eq(`= ${C(1, p1)} + ${C(2, p2)}`),
            eq(`= ${C(3, p1 + p2)}`),
          ],
        };
      },
    },
  ];

  const byId = {};
  skills.forEach((s, i) => { s.index = i; s.color = TONE[i % TONE.length]; byId[s.id] = s; });

  // Grade bands on the internal ability scale (grown-up labels and starting points).
  const GRADES = [
    { g: 'K', start: 8, upTo: 17 },
    { g: '1', start: 22, upTo: 32 },
    { g: '2', start: 37, upTo: 48 },
    { g: '3', start: 51, upTo: 63 },
    { g: '4', start: 65, upTo: 79 },
    { g: '5', start: 80, upTo: 101 },
  ];
  function gradeFor(theta) {
    for (const b of GRADES) if (theta < b.upTo) return b.g;
    return '5';
  }
  function gradeLabel(g) { return g === 'K' ? 'Kindergarten' : 'Grade ' + g; }
  function startTheta(g) { return (GRADES.find((b) => b.g === g) || GRADES[2]).start; }
  // "early / mid / late Grade 3" for grown-ups, instead of a raw number.
  function gradeDetail(theta) {
    const i = GRADES.findIndex((b) => theta < b.upTo);
    const b = GRADES[i < 0 ? GRADES.length - 1 : i];
    const lo = i <= 0 ? 0 : GRADES[i - 1].upTo, hi = Math.min(100, b.upTo);
    const f = (theta - lo) / (hi - lo);
    return (f < 0.34 ? 'early ' : f < 0.67 ? 'mid ' : 'late ') + (b.g === 'K' ? 'kindergarten' : 'grade ' + b.g);
  }

  function makeItem(skill, b) {
    const d = U.clamp((b - skill.lo) / (skill.hi - skill.lo), 0, 1);
    const base = skill.gen(d);
    return Object.assign({
      id: U.uid(), skillId: skill.id, d, b: U.lerp(skill.lo, skill.hi, d),
      expected: skill.t * (1 + 0.6 * d),
    }, base);
  }

  function skillsAt(b) {
    const bb = U.clamp(b, skills[0].lo, 100);
    let c = skills.filter((s) => bb >= s.lo - 1 && bb <= s.hi + 1);
    if (!c.length) c = [skills.reduce((best, s) => (Math.abs((s.lo + s.hi) / 2 - bb) < Math.abs((best.lo + best.hi) / 2 - bb) ? s : best))];
    return c;
  }

  function checkAnswer(item, input) {
    if (input == null) return false;
    switch (item.kind) {
      case 'int': return String(input).trim() !== '' && Number(input) === item.answer;
      case 'dec': {
        const x = parseFloat(input);
        return !isNaN(x) && Math.abs(U.fix(x) - item.answer) < 1e-9;
      }
      case 'choice': return input === item.answer;
      case 'frac': {
        const n = parseInt(input.n, 10);
        const dRaw = String(input.d || '').trim();
        const dd = dRaw === '' ? 1 : parseInt(dRaw, 10);
        if (isNaN(n) || isNaN(dd) || dd === 0) return false;
        if (n * item.answer.d !== item.answer.n * dd) return false;
        if (item.requireSimplest) return U.gcd(n, dd) === 1;
        return true;
      }
    }
    return false;
  }

  function answerText(item) {
    if (item.kind === 'frac') return item.answer.d === 1 ? String(item.answer.n) : fracStr(item.answer);
    if (item.kind === 'dec') return U.fmtDec(item.answer);
    return String(item.answer);
  }

  MP.Skills = { list: skills, byId, TONE, GRADES, gradeFor, gradeLabel, gradeDetail, startTheta, makeItem, skillsAt, checkAnswer, answerText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Numera adaptive engine.

   Ability model: one number (theta, 0-100) per learner, updated Elo/Rasch
   style after every answer. P(correct) = logistic((theta - b) / S).

   Placement: a computer-adaptive test. Each item is aimed at P = 0.5 (the
   most informative point); the step size shrinks as evidence builds.

   Sessions: short sets that mix item "roles" aimed at different success
   probabilities (warm-up 90%, core ~75%, stretch 55%, challenge 42%).

   Engagement controller: two running signals, frustration (F) and boredom
   (B), built from accuracy, streaks, response time relative to the learner's
   own pace, hints, skips and rapid guessing. High F eases off; high B lifts.

   Across sessions: a per-learner "challenge dial" (offset) and session length
   adapt to quits, self-reports and boredom, so the next session starts in a
   better place instead of repeating a static level. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = MP.U, SK = MP.Skills;

  const S = 6; // ability points per logit
    const ROLE_SHORT = { warmup: 'Warm', review: 'Rev', ease: 'Easy', finisher: 'Fin', retry: 'Retry', core: 'Core', stretch: 'Str', challenge: 'Chal', placement: 'Place' };
  const ROLE_LABEL = { warmup: 'Warm-up', review: 'Review', ease: 'Confidence', finisher: 'Finisher', retry: 'Second try', core: 'Core', stretch: 'Stretch', challenge: 'Challenge', placement: 'Placement' };

  const P = (theta, b) => U.logistic((theta - b) / S);
  const bFor = (theta, p) => theta - S * U.logit(p);

  function newProfile(name, grade, color) {
    const theta = SK.startTheta(grade);
    return {
      id: U.uid(), name, grade, color: color || 9, created: Date.now(),
      theta, placed: false, offset: 0, speed: 1, mode: 'balanced', qCount: 10, nudge: 0, harderTrust: 1,
      skills: {}, sessions: [], history: [{ t: Date.now(), theta, kind: 'start' }], demo: false, xp: 0,
    };
  }

  /* ---------------- Level + XP (what the child sees) ----------------
     Everyone starts at Level 1. XP comes from effort as well as correct
     answers, and never goes down, so the level only ever celebrates. */
  const XP = { correct: 10, hinted: 8, retry: 12, stretch: 15, challenge: 20, effort: 3, session: 25, placement: 20 };
  const levelNeed = (L) => 80 + 20 * L; // XP to go from level L to L+1
  function levelInfo(xp) {
    let level = 1, rem = Math.max(0, xp || 0), need = levelNeed(1);
    while (rem >= need) { rem -= need; level++; need = levelNeed(level); }
    return { level, into: rem, need, pct: rem / need };
  }
  function awardXP(profile, amt) {
    const before = levelInfo(profile.xp).level;
    profile.xp = (profile.xp || 0) + amt;
    const after = levelInfo(profile.xp).level;
    return { xp: amt, levelUp: after > before ? after : 0 };
  }
  function xpFor(item, r) {
    if (r.skipped || !r.correct) return XP.effort;
    if (r.hinted) return XP.hinted;
    return XP[item.role] || XP.correct;
  }

  function skillStat(profile, id) {
    return (profile.skills[id] = profile.skills[id] || { n: 0, correct: 0, acc: 0.5, last: 0, assumed: false });
  }

  function expectedTime(item, profile) { return item.expected * U.clamp(profile.speed || 1, 0.5, 3); }

  // Score for the ability update: correctness, shaded by speed and help.
  function scoreOf(r, item, profile) {
    if (r.skipped || !r.correct) return 0;
    let s = 1;
    if (r.hinted) s = 0.6;
    else if (r.time > 2.5 * expectedTime(item, profile)) s = 0.85;
    return s;
  }

  // Choose a skill for difficulty b, preferring variety.
  function chooseSkill(b, recent, profile, exclude) {
    let cands = SK.skillsAt(b).filter((s) => !(exclude || []).includes(s.id));
    if (!cands.length) cands = SK.skillsAt(b);
    const weights = cands.map((s) => {
      let w = 1;
      const i = recent.lastIndexOf(s.id);
      if (i >= 0) w *= recent.length - i <= 1 ? 0.15 : recent.length - i <= 3 ? 0.5 : 1;
      const st = profile.skills[s.id];
      if (!st || st.n < 3) w *= 1.3; // gently favour less-practised skills
      return w;
    });
    const tot = weights.reduce((a, x) => a + x, 0);
    let r = U.rand() * tot;
    for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r <= 0) return cands[i]; }
    return cands[cands.length - 1];
  }

  /* ---------------- Placement ---------------- */

  function startPlacement(profile) {
    return { kind: 'placement', theta: profile.theta, n: 0, max: 12, info: 0, answers: [], recent: [], start: Date.now(), consecWrong: 0 };
  }

  function nextPlacementItem(st, profile) {
    // Aim at P=0.5 with a little jitter so we don't repeat the same exact band.
    let b = st.theta + (U.rand() - 0.5) * 3;
    // After two misses in a row, give an easier one so the check-in stays kind.
    if (st.consecWrong >= 2) b = st.theta - 8;
    const skill = chooseSkill(b, st.recent, profile);
    const item = SK.makeItem(skill, b);
    item.role = 'placement';
    return item;
  }

  function recordPlacement(st, profile, item, r) {
    const p = P(st.theta, item.b);
    const score = r.skipped ? 0 : r.correct ? (r.hinted ? 0.7 : 1) : 0;
    const K = Math.max(3, 15 * Math.pow(0.8, st.n));
    st.theta = U.clamp(st.theta + K * 2 * (score - p), 0, 100);
    st.info += p * (1 - p);
    st.n++;
    st.recent.push(item.skillId);
    st.consecWrong = score > 0 ? 0 : st.consecWrong + 1;
    st.answers.push({ skill: item.skillId, b: U.fix(item.b, 1), correct: !!r.correct, skipped: !!r.skipped, time: U.fix(r.time, 1), theta: U.fix(st.theta, 1) });
    return awardXP(profile, xpFor(item, r));
  }

  function placementSE(st) { return st.info > 0 ? S / Math.sqrt(st.info) : 99; }
  function placementDone(st) { return st.n >= st.max || (st.n >= 8 && placementSE(st) < 6 && Math.abs(st.answers[st.n - 1].theta - st.answers[st.n - 3].theta) < 3); }

  function finishPlacement(st, profile) {
    profile.theta = U.fix(st.theta, 2);
    profile.placed = true;
    profile.placedAt = Date.now();
    profile.placement = { answers: st.answers, theta: profile.theta, se: U.fix(placementSE(st), 1) };
    // Skills well below the placement are assumed known (used for review).
    SK.list.forEach((s) => { if (s.hi < profile.theta - 4) { const k = skillStat(profile, s.id); k.assumed = true; } });
    st.answers.forEach((a) => { const k = skillStat(profile, a.skill); k.n++; if (a.correct) k.correct++; k.acc = k.correct / k.n; k.last = Date.now(); });
    profile.history.push({ t: Date.now(), theta: profile.theta, kind: 'placement' });
    const aw = awardXP(profile, XP.placement);
    return { theta: profile.theta, grade: SK.gradeFor(profile.theta), levelUp: aw.levelUp };
  }

  /* ---------------- Sessions ----------------
     Three modes the learner (or a grown-up) picks. Each sets a target
     success rate and a rhythm of question roles. After EVERY answer a
     staircase nudges difficulty toward the target: a right answer makes
     the next one harder, a miss makes it easier. Streaks can't coast. */

  const MODES = {
    easy: {
      label: 'Take it easy', blurb: 'Lots of wins. Warm-up reps.', target: 0.9, warmups: 2,
      p: { warmup: 0.97, core: 0.95, review: 0.96, stretch: 0.87, retry: 0.94, ease: 0.97, challenge: 0.75, finisher: 0.97 },
      plan: ['core', 'core', 'review', 'core', 'stretch', 'core', 'core', 'review'],
    },
    balanced: {
      label: 'Give me some hard ones', blurb: 'A mix of easy and tricky.', target: 0.7, warmups: 1,
      p: { warmup: 0.9, core: 0.74, review: 0.9, stretch: 0.5, retry: 0.8, ease: 0.93, challenge: 0.42, finisher: 0.86 },
      plan: ['core', 'stretch', 'core', 'review', 'stretch', 'core', 'stretch', 'core'],
    },
    stretch: {
      label: "Let's do this!", blurb: 'Big challenges. Tough on purpose.', target: 0.5, warmups: 1,
      p: { warmup: 0.85, core: 0.55, review: 0.85, stretch: 0.42, retry: 0.7, ease: 0.88, challenge: 0.35, finisher: 0.7 },
      plan: ['stretch', 'core', 'stretch', 'stretch', 'core', 'stretch', 'review', 'stretch'],
    },
  };
  const STEP = 4; // staircase step (ability points) per answer

  /* Success targets by enrolled grade (how much struggle a child can
     take depends on age, not skill level). Columns: easy, balanced, stretch. */
  const GRADE_ORDER = ['K', '1', '2', '3', '4', '5'];
  const GRADE_TARGETS = {
    K: [0.95, 0.85, 0.75], 1: [0.93, 0.82, 0.70], 2: [0.92, 0.80, 0.65],
    3: [0.90, 0.75, 0.60], 4: [0.90, 0.72, 0.55], 5: [0.90, 0.70, 0.50],
  };
  const MODE_COL = { easy: 0, balanced: 1, stretch: 2 };
  // Each child can drift up to one grade row either way from their own
  // signals (profile.nudge in [-1, 1]; positive = harder row).
  function targetsFor(profile) {
    const gi = Math.max(0, GRADE_ORDER.indexOf(String(profile.grade)));
    const x = U.clamp(gi + (profile.nudge || 0), 0, GRADE_ORDER.length - 1);
    const lo = Math.floor(x), hi = Math.ceil(x), f = x - lo;
    const rl = GRADE_TARGETS[GRADE_ORDER[lo]], rh = GRADE_TARGETS[GRADE_ORDER[hi]];
    const out = {};
    Object.keys(MODE_COL).forEach((m) => { out[m] = U.fix(U.lerp(rl[MODE_COL[m]], rh[MODE_COL[m]], f), 3); });
    return out;
  }
  // Shift a mode's whole rhythm (every role's success rate) to the target.
  function modeSpec(profile, mode) {
    const M = MODES[mode];
    const target = targetsFor(profile)[mode];
    const shift = U.logit(target) - U.logit(M.target);
    const p = {};
    Object.keys(M.p).forEach((k) => { p[k] = U.clamp(U.logistic(U.logit(M.p[k]) + shift), 0.3, 0.985); });
    return { target, p };
  }
  function nudgeLabel(profile) {
    const n = profile.nudge || 0;
    if (Math.abs(n) < 0.17) return 'no nudge';
    const steps = Math.round(Math.abs(n) * 3) / 3;
    return `nudged ${steps >= 0.99 ? 'a full grade' : steps >= 0.66 ? 'two steps' : 'one step'} ${n > 0 ? 'harder' : 'gentler'}`;
  }

  function daysSinceLast(profile, now) {
    const last = profile.sessions[profile.sessions.length - 1];
    return last ? (now - last.end) / 864e5 : 0;
  }

  function startSession(profile, now, opts) {
    now = now || Date.now();
    opts = opts || {};
    const mode = MODES[opts.mode || profile.mode] ? (opts.mode || profile.mode) : 'balanced';
    const len = U.clamp(Number(opts.len || profile.qCount || 10), 3, 30);
    const gap = daysSinceLast(profile, now);
    const spec = modeSpec(profile, mode);
    const st = {
      kind: 'session', id: U.uid(), start: now, len, idx: 0, mode, target: spec.target, p: spec.p, harderChecks: [], forceChallenge: false,
      F: 0, B: 0, peakF: 0, peakB: 0, stair: 0, consecWrong: 0, consecRight: 0,
      answers: [], log: [], recent: [], retryQueue: [], welcomeBack: gap >= 4, xp: 0, lastB: null,
    };
    if (st.welcomeBack) st.log.push({ i: 0, type: 'ease', text: `Back after ${Math.round(gap)} days, so the session opens with an extra warm-up.` });
    const recentQuits = profile.sessions.slice(-3).filter((s) => !s.completed).length;
    if (recentQuits >= 2) st.log.push({ i: 0, type: 'info', text: `${recentQuits} of the last 3 sessions ended early. Consider fewer questions or "Take it easy".` });
    return st;
  }

  function masteredSkills(profile) {
    return SK.list.filter((s) => {
      const k = profile.skills[s.id];
      return s.hi < profile.theta - 2 && (!k || k.assumed || k.acc >= 0.7);
    });
  }

  function pickRole(st, profile) {
    const M = MODES[st.mode], i = st.idx;
    const warmups = Math.min(M.warmups + (st.welcomeBack ? 1 : 0), Math.max(0, st.len - 2));
    if (i < warmups) return 'warmup';
    if (i === st.len - 1 && st.len >= 4) return 'finisher'; // end on a likely win
    if (st.F >= 0.55) return 'ease';
    if (st.forceChallenge) { st.forceChallenge = false; st.lastForced = true; return 'challenge'; }
    if (st.retryQueue.find((r) => r.at <= i)) return 'retry';
    if (st.B >= 0.55) return 'challenge';
    const role = M.plan[(i - warmups) % M.plan.length];
    if (role === 'review' && !masteredSkills(profile).length) return 'core';
    return role;
  }

  // Difficulty for a role right now: ability estimate, the learned
  // challenge dial, and the per-answer staircase.
  function targetB(st, profile, role) {
    const table = st.p || MODES[st.mode].p;
    const pTarget = table[role] || table.core;
    const steady = ['ease', 'warmup', 'finisher'].includes(role);
    const shift = profile.offset + st.stair;
    return bFor(profile.theta, pTarget) + (steady ? Math.min(shift, 4) : shift);
  }

  function nextSessionItem(st, profile) {
    const role = pickRole(st, profile);
    let b = targetB(st, profile, role);
    let skill, reason;

    if (role === 'retry') {
      const r = st.retryQueue.shift();
      skill = SK.byId[r.skill];
      b = Math.min(r.b - 2, b);
      reason = `Came back to ${skill.name.toLowerCase()} after a miss.`;
    } else if (role === 'review') {
      const pool = masteredSkills(profile);
      skill = pool.slice().sort((a, c) => (profile.skills[a.id]?.last || 0) - (profile.skills[c.id]?.last || 0))[Math.min(pool.length - 1, U.int(0, 1))];
      b = U.lerp(skill.lo, skill.hi, 0.6 + U.rand() * 0.4);
    } else {
      skill = chooseSkill(b, st.recent, profile);
    }
    if (role === 'ease') reason = st.consecWrong >= 2 ? 'Two misses in a row, so the next one is a confidence builder.' : 'Frustration signals rising, so the next one is a confidence builder.';
    if (role === 'challenge') reason = st.lastForced ? 'Asked for harder after a quick, unaided answer, so a challenge problem is up.' : 'Answers are fast and accurate, so a challenge problem is up.';
    st.lastForced = false;

    const item = SK.makeItem(skill, b);
    item.role = role;
    item.pBefore = P(profile.theta, item.b);
    // Tell the child when it's getting harder (never announce "easier").
    item.harder = st.lastB != null && item.b - st.lastB >= 3 && !['warmup', 'review', 'finisher', 'ease'].includes(role);
    st.lastB = item.b;
    if (reason) st.log.push({ i: st.idx, type: role === 'challenge' ? 'boost' : 'ease', text: reason });
    return item;
  }

  function recordSessionAnswer(st, profile, item, r) {
    const exp = expectedTime(item, profile);
    const t = Math.min(r.time, exp * 4); // idle time shouldn't swamp the model
    const ratio = r.time / exp;
    const p = P(profile.theta, item.b);
    const score = scoreOf(r, item, profile);
    const K = profile.sessions.length < 3 ? 4 : 2.5;
    const thetaBefore = profile.theta;
    profile.theta = U.clamp(profile.theta + K * 2 * (score - p), 0, 100);

    // Staircase: after every answer, move toward the mode's target.
    const outcome = r.correct && !r.skipped ? 1 : 0;
    const stairBefore = st.stair;
    st.stair = U.clamp(st.stair + STEP * (outcome - st.target), -12, 16);
    // A skip is a clear "too hard" signal: step down further.
    if (r.skipped) {
      st.stair = U.clamp(st.stair - 3, -12, 16);
      st.log.push({ i: st.idx, type: 'ease', text: 'Skipped, so the next problem steps down.' });
    }
    // Hot streaks turn it up faster (gently in "Take it easy").
    if (outcome && st.consecRight >= 2 && st.target <= 0.8) st.stair = Math.min(16, st.stair + 3 * (1 - st.target));

    if (r.correct && !r.hinted && r.time < exp * 4) {
      profile.speed = U.clamp(Math.exp(0.85 * Math.log(profile.speed || 1) + 0.15 * Math.log(Math.max(0.2, t / item.expected))), 0.5, 3);
    }

    const ks = skillStat(profile, item.skillId);
    ks.n++; if (r.correct) ks.correct++;
    ks.acc = ks.acc * 0.7 + (r.correct ? 0.3 : 0); ks.last = Date.now();

    // Engagement signals. In "Let's do this!" misses are expected, so they weigh less.
    const missW = st.target <= 0.6 ? 0.6 : st.target >= 0.9 ? 1.2 : st.target <= 0.72 ? 0.85 : 1;
    let F = st.F * 0.7, B = st.B * 0.72;
    const flags = [];
    const hardRole = ['stretch', 'challenge'].includes(item.role);
    if (r.skipped) { F += 0.3 * missW; flags.push('skipped'); }
    else if (!r.correct) {
      F += (hardRole ? 0.16 : 0.32) * missW;
      if (ratio < 0.3 && r.time < 4) { F += 0.15; flags.push('rapid guess'); }
    }
    if (r.hinted) { F += 0.08; flags.push('hint'); }
    if (r.time > 90) flags.push('long pause');
    if (r.correct && ratio > 2.5) { F += 0.1; flags.push('slow'); }
    if (r.correct && !r.hinted && ratio < 0.6 && item.role !== 'challenge') { B += 0.3; flags.push('fast'); }
    if (r.correct && ['warmup', 'review', 'ease', 'finisher'].includes(item.role) && ratio < 1) B += 0.12;
    if (r.correct && hardRole) { F -= 0.12; B -= 0.15; }

    st.consecWrong = r.correct ? 0 : st.consecWrong + 1;
    st.consecRight = r.correct ? st.consecRight + 1 : 0;
    if (st.consecWrong >= 2 && st.target > 0.6) F = Math.max(F, 0.6);
    if (st.consecWrong >= 3) F = Math.max(F, 0.6);
    if (st.consecRight >= 4 && ratio < 1) B = Math.max(B, 0.55);
    st.F = U.clamp(F, 0, 1); st.B = U.clamp(B, 0, 1);
    st.peakF = Math.max(st.peakF, st.F); st.peakB = Math.max(st.peakB, st.B);

    let retryQueued = false;
    if (!r.correct && item.role !== 'retry' && (!hardRole || st.mode === 'easy') && st.idx + 3 < st.len) {
      st.retryQueue.push({ skill: item.skillId, b: item.b, at: st.idx + 2 });
      retryQueued = true;
    }
    const aw = awardXP(profile, xpFor(item, r));
    st.xp += aw.xp;

    st.answers.push({
      i: st.idx, skill: item.skillId, role: item.role, b: U.fix(item.b, 1), p: U.fix(p, 2),
      correct: !!r.correct, skipped: !!r.skipped, hinted: !!r.hinted, time: U.fix(r.time, 1),
      expected: U.fix(exp, 1), F: U.fix(st.F, 2), B: U.fix(st.B, 2), theta: U.fix(profile.theta, 1),
      thetaBefore: U.fix(thetaBefore, 1), stair: U.fix(st.stair, 1), flags,
    });
    st.recent.push(item.skillId);
    st.idx++;
    // Did the answers after "Make it harder" back it up?
    st.harderChecks = st.harderChecks.filter((c) => {
      if (st.idx - c.at < 2) return true;
      const next = st.answers.slice(c.at, c.at + 2);
      const misses = next.filter((a) => !a.correct).length;
      const before = profile.harderTrust == null ? 1 : profile.harderTrust;
      if (misses === 2) profile.harderTrust = Math.max(0.3, before * 0.6);
      else if (misses === 1) profile.harderTrust = Math.max(0.3, before * 0.85);
      else profile.harderTrust = Math.min(1, before + 0.1);
      profile.harderTrust = U.fix(profile.harderTrust, 3);
      if (misses === 2) st.log.push({ i: c.at + 1, type: 'ease', text: 'Both answers after "Make it harder" were misses, so the button counts for less next time.' });
      else if (misses === 0 && before < 1) st.log.push({ i: c.at + 1, type: 'info', text: 'Answers after "Make it harder" backed it up, so the button earns back trust.' });
      return false;
    });
    return { F: st.F, B: st.B, score, xp: aw.xp, levelUp: aw.levelUp, retryQueued, streak: st.consecRight, stairUp: st.stair > stairBefore };
  }

  function sessionDone(st) { return st.idx >= st.len; }

  /* "Make it harder" (offered only right after a correct answer). Its
     weight depends on how that answer went, scaled by how well past

  function requestHarder(st, profile) {
    const a = st.answers[st.answers.length - 1];
    if (!a || !a.correct || a.askedHarder || st.idx >= st.len) return null;
    const ratio = a.time / a.expected;
    const trust = profile.harderTrust == null ? 1 : profile.harderTrust;
    let kind, step;
    if (!a.hinted && ratio < 0.8) { kind = 'big'; step = 6; if (trust >= 0.6) st.forceChallenge = true; }
    else if (!a.hinted && ratio < 1.5) { kind = 'medium'; step = 3.5; }
    else { kind = 'small'; step = 1.5; }
    const applied = U.fix(step * trust, 2);
    st.stair = U.clamp(st.stair + applied, -12, 16);
    st.B = Math.max(0, st.B - 0.2); // the ask itself addresses boredom
    a.askedHarder = kind;
    st.harderChecks.push({ at: st.idx });
    const why = kind === 'big' ? 'fast, no hint: big step up' + (st.forceChallenge ? ' and a challenge next' : '')
      : kind === 'medium' ? 'normal pace: medium step up' : (a.hinted ? 'used a hint' : 'slow answer') + ': small step up';
    st.log.push({ i: a.i, type: 'boost', text: `Asked to make it harder (${why}${trust < 1 ? `, trust ${Math.round(trust * 100)}%` : ''}).` });
    return { kind, step: applied };
  }

  // Close a session (finished or abandoned) and adapt for next time.
  function finishSession(st, profile, opts) {
    opts = opts || {};
    const now = opts.now || Date.now();
    const answered = st.answers.filter((a) => !a.skipped);
    const nCorrect = st.answers.filter((a) => a.correct).length;
    const acc = st.answers.length ? nCorrect / st.answers.length : 0;
    const completed = !!opts.completed;
    const feel = opts.feel || null;
    const changes = [];

    if (st.answers.length === 0 && !completed) return null; // opened and closed, nothing to learn

    // Carry part of the in-session staircase into the ability estimate
    // so the next session starts where this one ended.
    if (Math.abs(st.stair) > 2) {
      const carry = st.stair * 0.35;
      profile.theta = U.clamp(profile.theta + carry, 0, 100);
      changes.push(carry > 0 ? 'Next session starts a notch harder' : 'Next session starts a notch easier');
    }

    // Challenge dial: engagement preference, separate from ability.
    let dOff = 0;
    if (!completed) dOff -= st.peakF > 0.5 || acc < st.target - 0.2 ? 3 : 1.5;
    else if (feel === 'hard') dOff -= 2;
    else if (feel === 'easy') dOff += 2;
    else if (acc >= st.target + 0.15 && st.peakB >= 0.5) dOff += 1.5;
    else if (feel === 'right') dOff += (0 - profile.offset) * 0.15;
    profile.offset = U.fix(U.clamp(profile.offset + dOff, -10, 10), 2);
    if (Math.abs(dOff) >= 1) changes.push(dOff > 0 ? 'Challenge dial up' : 'Challenge dial down');

    // Grade-row nudge: the child's own signals move their targets up to one
    // grade row harder or gentler than their enrolled grade.
    const beforeN = profile.nudge || 0;
    const rowDown = !completed || feel === 'hard' || acc < st.target - 0.15;
    const rowUp = !rowDown && (feel === 'easy' || (acc >= st.target + 0.1 && st.peakB >= 0.5) || st.answers.filter((a) => a.askedHarder === 'big').length >= 2);
    if (rowDown) profile.nudge = U.fix(U.clamp(beforeN - 1 / 3, -1, 1), 3);
    else if (rowUp) profile.nudge = U.fix(U.clamp(beforeN + 1 / 3, -1, 1), 3);
    if (profile.nudge !== beforeN) changes.push(`Success targets ${profile.nudge > beforeN ? 'one step harder' : 'one step gentler'} (${nudgeLabel(profile)})`);

    let levelUp = 0;
    if (completed) { const aw = awardXP(profile, XP.session); st.xp += aw.xp; levelUp = aw.levelUp; }
    const rec = {
      xp: st.xp, levelUp, mode: st.mode, target: st.target, grade: profile.grade, nudge: profile.nudge || 0,
      harderAsks: st.answers.filter((a) => a.askedHarder).length,
      id: st.id, start: st.start, end: now, completed, feel, planned: st.len,
      n: st.answers.length, correct: nCorrect, acc: U.fix(acc, 3),
      avgRatio: U.fix(U.mean(answered.map((a) => a.time / a.expected)), 2),
      peakF: U.fix(st.peakF, 2), peakB: U.fix(st.peakB, 2),
      eases: st.log.filter((l) => l.type === 'ease').length,
      boosts: st.log.filter((l) => l.type === 'boost').length,
      ups: st.answers.filter((a, i) => i > 0 && a.b - st.answers[i - 1].b >= 3).length,
      theta: U.fix(profile.theta, 2), offset: profile.offset, answers: st.answers, log: st.log, changes,
    };

    profile.sessions.push(rec);
    profile.history.push({ t: now, theta: profile.theta, kind: 'session' });
    return rec;
  }

  /* ---------------- Positive session story ---------------- */
  function narrative(rec) {
    const as = rec.answers || [];
    if (!as.length) return '';
    const pick = (arr) => arr[Math.floor(U.rand() * arr.length)];
    const nm = (id) => SK.byId[id].name.toLowerCase();
    const join = (xs) => xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
    const counts = {}; as.forEach((a) => { counts[a.skill] = (counts[a.skill] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3);
    let best = 0, run = 0; as.forEach((a) => { run = a.correct ? run + 1 : 0; best = Math.max(best, run); });
    const ups = as.filter((a, i) => i > 0 && a.b - as[i - 1].b >= 3).length;
    const hardWins = as.filter((a) => a.correct && (a.role === 'stretch' || a.role === 'challenge')).length;
    const tried = as.filter((a) => !a.skipped).length;
    const retryWin = as.find((a) => a.role === 'retry' && a.correct);
    const misses = {}; as.forEach((a) => { if (!a.correct) misses[a.skill] = (misses[a.skill] || 0) + 1; });
    const toughest = Object.keys(misses).sort((a, b) => misses[b] - misses[a])[0];
    const out = [];
    out.push(pick(['What a session! 🌟', 'You worked so hard today! 💪', 'Your math brain was on fire today! 🔥', 'Wow, look at you go! 🚀']));
    const mode = { easy: 'You warmed up your math muscles with', balanced: 'You mixed easy and tricky problems in', stretch: 'You took on big challenges in' }[rec.mode] || 'You practiced';
    out.push(`${mode} ${join(top.map(nm))}, and you tried ${tried} problem${tried === 1 ? '' : 's'}.`);
    if (best >= 3) out.push(`You hit a streak of ${best} in a row!`);
    if (ups) out.push(`You got so good that the problems leveled up ${ups === 1 ? 'once' : ups + ' times'}. That’s what growing looks like!`);
    if (hardWins) out.push(`You cracked ${hardWins} tricky-on-purpose problem${hardWins > 1 ? 's' : ''}. That’s tough stuff!`);
    if (retryWin) out.push(`You came back to ${nm(retryWin.skill)} and nailed it on the second try. That’s how champions learn!`);
    else if (toughest) out.push('Every tricky problem you tried made your brain a little stronger.');
    if (!rec.completed) out.push('Taking a break when you need one is smart, too.');
    if (toughest) out.push(`Next time, Pip will bring back more ${nm(toughest)} so it gets easier and easier.`);
    out.push(pick(['Pip is so proud of you! 💜', 'Keep being awesome! ⭐', 'See you next time, math star! 🌈']));
    return out.join(' ');
  }

  /* ---------------- Engagement health (for grown-ups) ---------------- */

  function health(profile, now) {
    now = now || Date.now();
    const recent = profile.sessions.slice(-5);
    if (!profile.placed) return { status: 'new', label: 'Not placed yet', detail: 'Start with the placement check-in.' };
    if (recent.length < 2) return { status: 'new', label: 'Getting to know them', detail: 'A couple more sessions and the signals will settle.' };
    const quitRate = recent.filter((s) => !s.completed).length / recent.length;
    const acc = U.mean(recent.map((s) => s.acc));
    const F = U.mean(recent.map((s) => s.peakF));
    const B = U.mean(recent.map((s) => s.peakB));
    const hard = recent.filter((s) => s.feel === 'hard').length, easy = recent.filter((s) => s.feel === 'easy').length;
    const gap = daysSinceLast(profile, now);
    const target = U.mean(recent.map((s) => s.target || 0.75));
    const m = { quitRate, acc, F, B, gap, hard, easy };
    if (quitRate >= 0.4 || acc < target - 0.18 || hard >= 2)
      return { status: 'struggling', label: 'Drop-off risk: too hard', detail: `${Math.round(quitRate * 100)}% of recent sessions ended early and accuracy is ${Math.round(acc * 100)}%. Difficulty is easing; consider fewer questions or "Take it easy".`, m };
    if ((acc > target + 0.14 && B > 0.45) || easy >= 2)
      return { status: 'bored', label: 'Coasting: too easy', detail: `Accuracy ${Math.round(acc * 100)}% with fast answers. The challenge dial is rising to add stretch.`, m };
    if (gap >= 5)
      return { status: 'lapsing', label: 'Drifting away', detail: `No session in ${Math.round(gap)} days. The next one opens with extra warm-ups.`, m };
    return { status: 'flow', label: 'In the zone', detail: `Accuracy ${Math.round(acc * 100)}% against a ${Math.round(target * 100)}% target, with few early exits.`, m };
  }

  MP.Engine = {
    S, P, bFor, MODES, ROLE_LABEL, ROLE_SHORT, XP, levelInfo, awardXP, newProfile, expectedTime,
    startPlacement, nextPlacementItem, recordPlacement, placementDone, finishPlacement, placementSE,
    startSession, nextSessionItem, recordSessionAnswer, sessionDone, finishSession, health, masteredSkills, narrative,
    requestHarder, targetsFor, modeSpec, nudgeLabel, GRADE_TARGETS,
  };
})(typeof window !== 'undefined' ? window : globalThis);
