/* Simulated learners. Used for the sample "demo" profile and for tests.
   A simulated learner has a true ability that the engine never sees. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const U = MP.U, E = MP.Engine;

  function gauss() { let u = 0, v = 0; while (!u) u = U.rand(); while (!v) v = U.rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  function answer(learner, item) {
    const p = U.logistic((learner.ability - item.b) / 6);
    const correct = U.rand() < p;
    const time = item.expected * learner.pace * Math.exp(gauss() * 0.3) * (correct ? 1 : 1.3);
    return { correct, time, hinted: !correct && U.chance(learner.hintRate || 0), skipped: false };
  }

  function runPlacement(profile, learner) {
    const st = E.startPlacement(profile);
    while (!E.placementDone(st)) {
      const item = E.nextPlacementItem(st, profile);
      E.recordPlacement(st, profile, item, answer(learner, item));
    }
    return E.finishPlacement(st, profile);
  }

  // quitAtF: the learner walks away if frustration passes this level.
  function runSession(profile, learner, opts) {
    opts = opts || {};
    const st = E.startSession(profile, opts.start, { mode: opts.mode, len: opts.len });
    let quit = false;
    while (!E.sessionDone(st)) {
      const item = E.nextSessionItem(st, profile);
      E.recordSessionAnswer(st, profile, item, answer(learner, item));
      if (opts.quitAtF != null && st.F > opts.quitAtF && U.chance(0.6)) { quit = true; break; }
    }
    const acc = st.answers.filter((a) => a.correct).length / Math.max(1, st.answers.length);
    const feel = quit ? null : acc > 0.95 ? 'easy' : acc < 0.35 ? 'hard' : 'right';
    return E.finishSession(st, profile, { completed: !quit, feel, now: (opts.start || Date.now()) + st.answers.reduce((s, a) => s + a.time, 0) * 1000 });
  }

  // A realistic sample learner: placed a little too high, has one rough
  // session, then the dial and length adjust and they settle into the zone.
  function demoProfile(now) {
    now = now || Date.now();
    U.seed(20260911);
    const p = E.newProfile('Sam (sample)', '2', 5);
    p.demo = true;
    p.created = now - 12 * 864e5;
    p.history[0].t = p.created;
    const learner = { ability: 41, pace: 1.2, hintRate: 0.1 };
    runPlacement(p, learner);
    p.placedAt = p.created + 60e3;
    p.history[p.history.length - 1].t = p.placedAt;
    const days = [11, 10, 9, 8, 6, 5, 4, 2, 1, 0.2];
    days.forEach((dAgo, i) => {
      if (i === 2) learner.ability -= 9; // a rough day
      if (i === 3) learner.ability += 9;

      runSession(p, learner, { start: now - dAgo * 864e5, quitAtF: i < 4 ? 0.62 : 0.8, mode: ['balanced', 'balanced', 'stretch', 'easy', 'balanced', 'balanced', 'stretch', 'balanced', 'balanced', 'stretch'][i] });

<script>
/* Numera dry-erase whiteboard: plays a worked example step by step,
   written in coloured marker. Step data comes from js/skills.js (item.wb). */
(function (root) {
  const MP = (root.MP = root.MP || {});

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const colors = (s) => esc(s).replace(/\{(\d):([^}]*)\}/g, (m, c, t) => `<span class="mk${c}">${t}</span>`);
  function rich(str) {
    let out = '', last = 0, m;
    const re = /\[([^\]\/]+)\/([^\]]+)\]/g;
    while ((m = re.exec(str))) {
      out += colors(str.slice(last, m.index));

    if (st.pack) chunk(st.groups.flatMap((g) => Array.from({ length: g.n }, () => g)));

    return [html.replace(/--t:(\d+)/g, (m, n) => `--t:${(n * 0.06).toFixed(2)}`), Math.min(k, 24) * 60 + 700];
  }

  function numberLine(st) {
    const W = 560, pad = 26, axis = 72;
    const range = st.max - st.min;
    const x = (v) => pad + ((v - st.min) / range) * (W - 2 * pad);
    const step = range <= 20 ? 1 : range <= 50 ? 5 : 10;
    const labelEvery = range <= 12 ? 1 : range <= 20 ? 2 : step;
    let svg = `<line x1="${pad - 10}" y1="${axis}" x2="${W - pad + 10}" y2="${axis}" class="wb-stroke"/>`;

    for (let v = Math.ceil(st.min / step) * step; v <= st.max; v += step) {
      svg += `<line x1="${x(v)}" y1="${axis - 7}" x2="${x(v)}" y2="${axis + 7}" class="wb-stroke thin"/>`;
      if (v % labelEvery === 0 && !markVals.some((mv) => mv !== v && Math.abs(x(mv) - x(v)) < 16)) svg += `<text x="${x(v)}" y="${axis + 26}" class="wb-tick">${v}</text>`;
    }
    st.marks.forEach((m) => {
      svg += `<circle cx="${x(m.v)}" cy="${axis}" r="7" style="fill:${INK[m.c]}"/><text x="${x(m.v)}" y="${axis + 27}" class="wb-tick strong" style="fill:${INK[m.c]}">${m.v}</text>`;
    });
    st.hops.forEach((hp, i) => {
      const x1 = x(hp.from), x2 = x(hp.to), hgt = Math.min(46, 16 + Math.abs(x2 - x1) * 0.35);

  // Column arithmetic with animated carries (+) and trades (−), decimals too.

    html += '<span></span>' + rowCells((k, i) => k === 'pt' ? cell('.', 'pt mk3', tRes[W - 1]) : cell(res[i], 'mk3', res[i] == null ? null : tRes[i]));

  }

  function arrayStep(st) {
    let k = 0;
    const rows = Array.from({ length: st.rows }, (_, r) => `<div class="wb-arow seq" style="--t:${(r * 0.25).toFixed(2)}">${'<i></i>'.repeat(st.cols)}</div>`).join('');
    return [`<div class="wb-array">${rows}</div>`, st.rows * 250 + 700 + k];
  }

  function area(st) {
    const cells = [];

    let html = `<div class="wb-area" style="grid-template-columns: auto repeat(${st.cols.length}, minmax(62px, 1fr))"><span></span>`;
    st.cols.forEach((c) => { html += `<span class="hd mk1">${c}</span>`; });
    st.rows.forEach((r) => {
      html += `<span class="hd side mk2">${r}</span>`;
      st.cols.forEach((c) => { html += `<span class="cell"><b class="seq mk3" style="--t:${(0.3 + t * 0.55).toFixed(2)}">${r * c}</b><small>${r} × ${c}</small></span>`; t++; cells.push(r * c); });

  function bars(st) {
    let t = 0;
    const html = `<div class="wb-bars">${st.bars.map((b) => {
      const cells = [];
      let filled = 0;
      b.fills.forEach((f) => { for (let i = 0; i < f.n; i++) cells.push({ c: f.c, t: t++ }); filled += f.n; });

/* Local persistence. One JSON blob in localStorage, with an in-memory
   fallback when storage is blocked. Swap this file for Capacitor
   Preferences or SQLite when packaging for the app stores. */
(function (root) {
  const MP = (root.MP = root.MP || {});
  const KEY = 'numera.v1';
  const OLD_KEYS = ['mathpath.v1']; // data saved before the rename to Numera
  let memory = null;

  function load() {
    try {
      let raw = root.localStorage && root.localStorage.getItem(KEY);
      if (!raw && root.localStorage) {
        for (const k of OLD_KEYS) { raw = root.localStorage.getItem(k); if (raw) { root.localStorage.setItem(KEY, raw); break; } }
      }
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage blocked or corrupt: fall through */ }
    return memory || { v: 1, profiles: [], activeId: null, seededDemo: false };
  }

  function save(data) {
    memory = data;
    try { root.localStorage && root.localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  MP.Store = { load, save, KEY };
})(typeof window !== 'undefined' ? window : globalThis);
